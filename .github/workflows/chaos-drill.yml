name: Chaos drill

# Q4.15 (#315). Runs the trading-host chaos drill against the same
# compose stack the conformance / e2e-smoke jobs use. Deliberately NOT
# gated on PRs (chaos boots the full real stack and is too expensive
# per-PR) — manual dispatch + nightly only.
#
# Triggers:
#   - workflow_dispatch  → operator-initiated run
#   - schedule (daily 04:00 UTC)
#
# Pairs with: docs/operations/runbook-failover-recovery.md §6 and
#             scripts/chaos/run-chaos-drill.sh.
#
# #790. Deliberately does NOT stack docker-compose.real-conformance.yml on
# top of the real stack: that overlay swaps matching-platform's FIXP timers
# to the fast conformance profile (heartbeatIntervalMs=idleTimeoutMs=500ms,
# so the venue reaps a severed session in ~1.5s) for the SessionRoll
# conformance spec, which deliberately WANTS a fast forced roll. Chaos
# drill's network-partition scenario holds the partition for
# PARTITION_HOLD_S=10s (a realistic blip) expecting FIXP's Establish-reuse
# reattach — NOT a peer-forced session roll — to recover it; under the fast
# conformance timers the venue always evicts the session (~1.5s < 10s)
# before trading-host ever attempts to reconnect, guaranteeing a
# Renegotiated roll (and the resulting Ambiguous outbound mutations) on
# every single run. The base stack's own bridge config
# (docker/real/exchange-simulator.bridge.json, heartbeat/idle=30s) easily
# outlasts a 10s partition and is what this scenario is meant to exercise.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Chaos scenario to run"
        required: true
        default: "host-kill"
        type: choice
        options:
          - host-kill
          - marketdata-kill
          - network-partition
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  chaos:
    name: Chaos drill
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Same throwaway placeholders the conformance job uses — sandboxed
      # in CI, never touch production secrets.
      TRADING_AUTH_SIGNING_KEY: ci-chaos-drill-placeholder-key-min-32-bytes-long-aaaaa
      TRADING_SEED_USER: alice
      TRADING_SEED_PASSWORD: wonderland
      TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
      TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
      # Q4.8 (#308). CVM export boot guard requires this even though
      # the chaos drill does not exercise CVM endpoints.
      Trading__Reports__Cvm__OwnerHashSalt: chaos-only-cvm-salt-placeholder-DO-NOT-USE-IN-PROD

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve rotating scenario
        id: scenario
        env:
          REQUESTED: ${{ github.event.inputs.scenario }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED" ]]; then
            scenario="$REQUESTED"
          else
            scenarios=(host-kill marketdata-kill network-partition)
            scenario="${scenarios[$((10#$(date -u +%j) % ${#scenarios[@]}))]}"
          fi
          echo "SCENARIO=$scenario" >>"$GITHUB_ENV"
          echo "scenario=$scenario" >>"$GITHUB_OUTPUT"
          echo "Selected scheduled scenario: $scenario"

      - name: Bring up trading-host (Real stack)
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.chaos.yml \
              up -d --build --wait trading-host

      - name: Run chaos drill
        run: |
          chmod +x scripts/chaos/run-chaos-drill.sh
          scripts/chaos/run-chaos-drill.sh --scenario "$SCENARIO"

      - name: Upload chaos artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-artifacts-${{ steps.scenario.outputs.scenario }}
          path: chaos-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Trading-host logs (on failure)
        if: failure()
        run: |
          mkdir -p logs
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.chaos.yml \
              logs --no-color trading-host > logs/trading-host.log || true
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.chaos.yml \
              logs --no-color matching-platform > logs/matching-platform.log || true
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.chaos.yml \
              logs --no-color marketdata > logs/marketdata.log || true

      - name: Upload container logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs-${{ steps.scenario.outputs.scenario }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.chaos.yml \
              down -v || true
