name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET SDK (pinned by global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore B3TradingPlatform.slnx

      - name: Build (Release, warnings-as-errors)
        run: dotnet build B3TradingPlatform.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test B3TradingPlatform.slnx
          --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*
          if-no-files-found: ignore
          retention-days: 14

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET SDK (pinned by global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore (needed by dotnet format)
        run: dotnet restore B3TradingPlatform.slnx

      - name: dotnet format --verify-no-changes
        run: dotnet format B3TradingPlatform.slnx --verify-no-changes --no-restore --severity warn

  frontend:
    name: Frontend lint (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The frontend is currently vanilla HTML+JS (no build step), mirroring
      # B3MarketDataPlatform. This job exists so the CI surface is in place
      # for when a real build/lint is added; for now it just sanity-checks
      # the entry point is present.
      - name: Verify frontend entry point exists
        run: test -f frontend/index.html

      - name: Set up Node (for decoder unit tests)
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run mdProtocol decoder tests (no deps, node:test)
        run: node --test frontend/test/decoder.test.mjs

      - name: Run state reducer tests (no deps, node:test)
        run: node --test frontend/test/state-modify.test.mjs frontend/test/state-staleness.test.mjs frontend/test/cancel-all.test.mjs frontend/test/validation-rules.test.mjs frontend/test/pretrade-guards.test.mjs frontend/test/bot-credentials-ui.test.mjs frontend/test/phase-badge.test.mjs frontend/test/auction-panel.test.mjs frontend/test/ticket-phase-coupling.test.mjs frontend/test/ticket-validation.test.mjs frontend/test/ticket-form-conditionals.test.mjs frontend/test/working-orders-render.test.mjs frontend/test/order-detail-q14.test.mjs frontend/test/executions-expired-badge.test.mjs frontend/test/expired-status-surfaces.test.mjs frontend/test/history-tab.test.mjs frontend/test/pnl-panel.test.mjs frontend/test/statement-download.test.mjs frontend/test/state-clear-races.test.mjs frontend/test/compliance-ui.test.mjs frontend/test/qr-render.test.mjs frontend/test/algos-state.test.mjs frontend/test/algos-validation.test.mjs frontend/test/settings-subtab.test.mjs frontend/test/trader-subtab.test.mjs frontend/test/keyboard.test.mjs frontend/test/density.test.mjs

  frontend-a11y:
    # Fase 5 follow-up (#407). axe-core + Lighthouse CI gate against
    # the static frontend. Runs on every PR; Chromium is cached so
    # warm runs stay under a couple of minutes.
    name: Frontend a11y
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/a11y

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/a11y/package-lock.json

      - name: Set up Chrome (matches axe-core's bundled ChromeDriver)
        # axe-core/cli auto-downloads the latest ChromeDriver; the
        # ubuntu-latest preinstalled Chrome lags by ~1 version which
        # makes ChromeDriver refuse to attach. Install the latest
        # stable Chrome via setup-chrome so both stay in sync.
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Cache Puppeteer / Lighthouse Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('frontend/a11y/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      - name: Install pinned deps
        run: npm ci --no-audit --no-fund

      - name: Export Chrome binary path
        run: |
          echo "GOOGLE_CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >>"$GITHUB_ENV"
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version

      - name: Serve frontend on :8088
        run: |
          nohup npx http-server .. -p 8088 -c-1 -s >/tmp/http-server.log 2>&1 &
          echo "HTTP_PID=$!" >>"$GITHUB_ENV"
          # Wait until the server actually answers (max 20s).
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8088/; then
              echo "http-server up after ${i}*0.5s"; exit 0
            fi
            sleep 0.5
          done
          echo "::error::http-server never came up"; cat /tmp/http-server.log; exit 1

      - name: axe-core (WCAG 2.1 AA)
        run: |
          npx axe http://127.0.0.1:8088/ \
            --exit \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --chrome-path "$GOOGLE_CHROME_BIN"

      - name: Lighthouse CI (a11y + perf)
        # chrome-launcher prefers $CHROME_PATH; the bundled Puppeteer
        # Chromium under ~/.cache/puppeteer is fine, but explicitly
        # pointing at the system Chrome keeps both audits on the same
        # build.
        env:
          CHROME_PATH: ${{ env.GOOGLE_CHROME_BIN }}
        run: npx lhci autorun --config=./lighthouserc.json

      - name: Tail http-server log on failure
        if: failure()
        run: tail -200 /tmp/http-server.log || true

      - name: Stop http-server
        if: always()
        run: kill "$HTTP_PID" 2>/dev/null || true
