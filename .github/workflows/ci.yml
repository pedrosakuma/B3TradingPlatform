name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET SDK (pinned by global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore B3TradingPlatform.slnx

      - name: Build (Release, warnings-as-errors)
        run: dotnet build B3TradingPlatform.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test B3TradingPlatform.slnx
          --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*
          if-no-files-found: ignore
          retention-days: 14

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET SDK (pinned by global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore (needed by dotnet format)
        run: dotnet restore B3TradingPlatform.slnx

      - name: dotnet format --verify-no-changes
        run: dotnet format B3TradingPlatform.slnx --verify-no-changes --no-restore --severity warn

  frontend:
    name: Frontend lint (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build static frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Verify design-system catalog is packaged
        run: test -f frontend/dist/design-system.html

      - name: Smoke-test env.js rendering directly
        run: ./frontend/test/render-env-js-direct-smoke.sh

      - name: Smoke-test env.js rendering inside the real frontend container
        run: ./frontend/test/render-env-js-container-smoke.sh

      - name: Run frontend unit tests (explicit file list)
        run: npm --prefix frontend test

  frontend-a11y:
    # Fase 5 follow-up (#407). axe-core + Lighthouse CI gate against
    # the static frontend. Runs on every PR; Chromium is cached so
    # warm runs stay under a couple of minutes.
    name: Frontend a11y
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/a11y

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/a11y/package-lock.json

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('frontend/a11y/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      - name: Install pinned deps
        # Triggers puppeteer's postinstall which downloads its bundled
        # Chromium into ~/.cache/puppeteer (cache-hit reuses it).
        run: npm ci --no-audit --no-fund

      - name: Build frontend bundle for audit
        run: |
          npm --prefix .. ci --no-audit --no-fund
          npm --prefix .. run build

      - name: Resolve Puppeteer Chromium for Lighthouse
        # lhci uses chrome-launcher, which honours $CHROME_PATH. Point it
        # at the same Chromium puppeteer downloaded so both audits run
        # against the same binary.
        run: |
          CHROME_BIN="$(node -e 'process.stdout.write(require("puppeteer").executablePath())')"
          echo "CHROME_PATH=${CHROME_BIN}" >>"$GITHUB_ENV"
          "${CHROME_BIN}" --version

      - name: Serve frontend on :8088
        run: |
          nohup npx http-server ../dist -p 8088 -c-1 -s >http-server.log 2>&1 &
          echo "HTTP_PID=$!" >>"$GITHUB_ENV"
          # Wait until the server actually answers (max 20s).
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8088/; then
              echo "http-server up after ${i}*0.5s"; exit 0
            fi
            sleep 0.5
          done
          echo "::error::http-server never came up"; cat http-server.log; exit 1

      - name: axe-core (WCAG 2.1 AA)
        # Wrapper script launches puppeteer with --no-sandbox so Chrome
        # can start as root on the runner; @axe-core/cli didn't expose
        # that flag and crashed on launch.
        run: npm run axe

      - name: Lighthouse CI (a11y + perf)
        run: npx lhci autorun --config=./lighthouserc.json

      - name: Tail http-server log on failure
        if: failure()
        run: tail -200 http-server.log || true

      - name: Stop http-server
        if: always()
        run: kill "$HTTP_PID" 2>/dev/null || true
