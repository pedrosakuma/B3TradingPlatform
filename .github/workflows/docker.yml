name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  trading-host:
    name: Build trading-host image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-trading-host
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/src/B3.Trading.Host/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trading-host
          cache-to:   type=gha,scope=trading-host,mode=max

  frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-trading-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: docker compose config
        # The compose file requires a few env vars (?: validators); set
        # placeholders just to satisfy parsing. We're testing structure,
        # not runtime.
        env:
          TRADING_AUTH_SIGNING_KEY: validate-only-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.observability.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.conformance.yml config --quiet

  conformance:
    name: Run conformance suite against compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: trading-host
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bring up trading-host
        env:
          # alice/wonderland — the committed hash/salt match this plaintext.
          # Signing key is a CI-only placeholder; conformance only checks
          # the round-trip works, not that the key is unique.
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_USER: alice
          TRADING_SEED_PASSWORD: wonderland
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.conformance.yml \
              up -d --build --wait trading-host

      - name: Run conformance
        env:
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_USER: alice
          TRADING_SEED_PASSWORD: wonderland
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.conformance.yml \
              run --rm conformance

      - name: Trading-host logs (always)
        if: always()
        env:
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.conformance.yml \
              logs trading-host || true

      - name: Tear down
        if: always()
        env:
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.conformance.yml \
              down -v

  real-stack-conformance:
    name: Run conformance suite against real stack (matching-platform)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: trading-host
    env:
      # Same CI placeholders as the conformance job above (alice/wonderland).
      TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
      TRADING_SEED_USER: alice
      TRADING_SEED_PASSWORD: wonderland
      TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
      TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bring up real stack (matching-platform + trading-host)
        # docker-compose.real.yml flips trading-host to Mode=Real and adds
        # the matching-platform service. Conformance overlay still piles
        # on the carol admin seed. --wait blocks until matching's healthcheck
        # passes AND trading-host reports healthy (FIXP Negotiate
        # succeeded against matching).
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              up -d --build --wait trading-host

      - name: Run conformance
        # Per RFC integration-real-stack-v0 §4.7: auth + admin/firms +
        # risk-rejection-shape exercise the real wire; simulator + algo
        # specs auto-skip on RequiresSimulator (no Mode=Simulator).
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              run --rm conformance

      - name: Logs (always)
        if: always()
        run: |
          for svc in trading-host matching-platform; do
            echo "::group::$svc"
            docker compose \
                -f docker/docker-compose.yml \
                -f docker/docker-compose.real.yml \
                -f docker/docker-compose.conformance.yml \
                logs --no-color --timestamps "$svc" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              down -v
