name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  trading-host:
    name: Build trading-host image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-trading-host
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/src/B3.Trading.Host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trading-host
          cache-to:   type=gha,scope=trading-host,mode=max

  frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-trading-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: docker compose config
        # The compose file requires a few env vars (?: validators); set
        # placeholders just to satisfy parsing. We're testing structure,
        # not runtime.
        env:
          TRADING_AUTH_SIGNING_KEY: validate-only-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.unavailable.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.observability.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.conformance.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.demo.yml config --quiet

      - name: docker compose config (er-injection overlay)
        # The er-injection overlay (#259, Q1.7) requires a per-run admin
        # PBKDF2 triple via `${VAR:?}` interpolation (see
        # docker/docker-compose.er-injection.yml header). Mirror the
        # placeholders the manual conformance workflow uses so the
        # validate step can parse the merged file. Validate-only — never
        # used to actually boot the host in this job.
        env:
          TRADING_AUTH_SIGNING_KEY: validate-only-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
          B3T_CONFORMANCE_ADMIN_PASSWORD: ci-conformance-2024-do-not-use-in-prod
          B3T_CONFORMANCE_ADMIN_PASSWORD_HASH: YPCvuCrUq4h6e8ebNKvxRAda8DWQdOf+0uakwAxar9E=
          B3T_CONFORMANCE_ADMIN_PASSWORD_SALT: Q0lDb25mb3JtYW5jZTE2Qg==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.er-injection.yml \
              config --quiet

      - name: docker compose config (public overlay)
        # The public overlay (#531) fails closed: every secret/cert uses
        # `${VAR:?}`. Set validate-only placeholders so the merged file
        # parses. Validate-only — never boots the host.
        env:
          TRADING_AUTH_SIGNING_KEY: validate-only-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
          TRADING_CVM_OWNER_HASH_SALT: validate-only-cvm-salt
          TRADING_CLORDID_MASK_SALT: validate-only-clordid-mask-salt
          PUBLIC_FIXP_TLS_DIR: /tmp/fixp-tls
          PUBLIC_FIXP_TLS_CERT: /etc/ssl/fixp/server.pfx
          PUBLIC_FIXP_CA_BUNDLE: /etc/ssl/fixp/bot-ca-bundle.pem
          PUBLIC_FIXP_CA_DENYLIST: /etc/ssl/fixp/bot-denylist.txt
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.public.yml \
              config --quiet

  conformance:
    name: Run conformance suite against unavailable-mode stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: trading-host
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bring up trading-host
        env:
          # alice/wonderland — the committed hash/salt match this plaintext.
          # Signing key is a CI-only placeholder; conformance only checks
          # the round-trip works, not that the key is unique.
          # The unavailable.yml overlay flips trading-host back to
          # Mode=Unavailable (the pre-default-Real posture) so this job
          # exercises the no-broker fail-closed contract — admin/firms
          # CRUD, auth, risk-rejection-shape — without spinning up
          # matching-platform. The real-stack-conformance job below
          # covers the Mode=Real wire end-to-end.
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_USER: alice
          TRADING_SEED_PASSWORD: wonderland
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.unavailable.yml \
              -f docker/docker-compose.conformance.yml \
              up -d --build --wait trading-host

      - name: Run conformance
        env:
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_USER: alice
          TRADING_SEED_PASSWORD: wonderland
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.unavailable.yml \
              -f docker/docker-compose.conformance.yml \
              run --rm --no-deps conformance

      - name: Trading-host logs (always)
        if: always()
        env:
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.unavailable.yml \
              -f docker/docker-compose.conformance.yml \
              logs trading-host || true

      - name: Tear down
        if: always()
        env:
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.unavailable.yml \
              -f docker/docker-compose.conformance.yml \
              down -v

  real-stack-conformance:
    name: Run conformance suite against real stack (matching-platform)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: trading-host
    env:
      # Same CI placeholders as the conformance job above (alice/wonderland).
      TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
      TRADING_SEED_USER: alice
      TRADING_SEED_PASSWORD: wonderland
      TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
      TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bring up real stack (matching-platform + marketdata + trading-host)
        # docker-compose.real.yml flips trading-host to Mode=Real, adds
        # the matching-platform service, and (since v1) the marketdata-live
        # service consuming matching's UMDF unicast — so trading-host's
        # IReferencePrice is wired through MarketDataReferencePrice end-to-end
        # instead of falling back to the static map. Conformance overlay still
        # piles on the carol admin seed. real-conformance.yml opts the run
        # into RequiresSandboxMatching specs (separate file so non-conformance
        # combos like real+demo don't trip a "service has no image" validation
        # on a partial conformance fragment). --wait blocks until matching's
        # healthcheck passes AND trading-host reports healthy (FIXP Negotiate
        # succeeded against matching).
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.real-conformance.yml \
              up -d --build --wait trading-host

      - name: Run conformance
        # Per RFC integration-real-stack-v0 §4.7: auth + admin/firms +
        # risk-rejection-shape exercise the real wire; ER-injection +
        # algo specs auto-skip on RequiresErInjection (host doesn't set
        # AllowErInjection in the real-stack profile, #163).
        # `--no-deps` is critical: without it, `docker compose run` will
        # recreate trading-host (and its FIXP session) between the
        # `up --wait` step and conformance execution, which leaves the
        # SDK trying to reuse SessionVerId=1 against a matching that
        # already saw last-seen=1, producing a permanent negotiate-reject
        # loop and the spec timing out at `sessionState=terminating`.
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.real-conformance.yml \
              run --rm --no-deps conformance

      - name: Logs (always)
        if: always()
        run: |
          for svc in trading-host matching-platform marketdata; do
            echo "::group::$svc"
            docker compose \
                -f docker/docker-compose.yml \
                -f docker/docker-compose.real.yml \
                -f docker/docker-compose.conformance.yml \
                -f docker/docker-compose.real-conformance.yml \
                logs --no-color --timestamps "$svc" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.real-conformance.yml \
              down -v
