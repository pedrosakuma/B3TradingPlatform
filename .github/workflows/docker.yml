name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  trading-host:
    name: Build trading-host image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-trading-host
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (export to local tar)
        # We build once here and write the image to a tar file so the
        # downstream conformance + real-stack-conformance jobs can `docker
        # load` it instead of rebuilding (which suffered the apt-mirror
        # flake on the runtime stage every PR). Pushing to GHCR is split
        # into a separate step below so we still hit GHA layer cache while
        # also producing the tar artifact.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/src/B3.Trading.Host/Dockerfile
          tags: |
            ${{ steps.meta.outputs.tags }}
            b3-trading-host:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trading-host
          cache-to:   type=gha,scope=trading-host,mode=max
          outputs: type=docker,dest=/tmp/trading-host-image.tar

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker load -i /tmp/trading-host-image.tar
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            # Skip the local-only ci tag.
            case "$tag" in b3-trading-host:ci) continue ;; esac
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Upload trading-host image artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-host-image
          path: /tmp/trading-host-image.tar
          retention-days: 1
          compression-level: 6

  frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-trading-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: docker compose config
        # The compose file requires a few env vars (?: validators); set
        # placeholders just to satisfy parsing. We're testing structure,
        # not runtime.
        env:
          TRADING_AUTH_SIGNING_KEY: validate-only-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.observability.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.conformance.yml config --quiet

  conformance:
    name: Run conformance suite against compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: trading-host
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download trading-host image
        uses: actions/download-artifact@v4
        with:
          name: trading-host-image
          path: /tmp

      - name: Load trading-host image
        run: docker load -i /tmp/trading-host-image.tar

      - name: Bring up trading-host
        env:
          # Reuse the image built by the trading-host job (loaded above).
          TRADING_IMAGE: b3-trading-host:ci
          # alice/wonderland — the committed hash/salt match this plaintext.
          # Signing key is a CI-only placeholder; conformance only checks
          # the round-trip works, not that the key is unique.
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_USER: alice
          TRADING_SEED_PASSWORD: wonderland
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.conformance.yml \
              up -d --wait trading-host

      - name: Run conformance
        env:
          TRADING_IMAGE: b3-trading-host:ci
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_USER: alice
          TRADING_SEED_PASSWORD: wonderland
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.conformance.yml \
              run --build --rm conformance

      - name: Trading-host logs (always)
        if: always()
        env:
          TRADING_IMAGE: b3-trading-host:ci
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.conformance.yml \
              logs trading-host || true

      - name: Tear down
        if: always()
        env:
          TRADING_IMAGE: b3-trading-host:ci
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.conformance.yml \
              down -v

  real-stack-conformance:
    name: Run conformance suite against real stack (matching-platform)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: trading-host
    env:
      # Reuse the image built by the trading-host job (loaded below).
      TRADING_IMAGE: b3-trading-host:ci
      # Same CI placeholders as the conformance job above (alice/wonderland).
      TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
      TRADING_SEED_USER: alice
      TRADING_SEED_PASSWORD: wonderland
      TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
      TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download trading-host image
        uses: actions/download-artifact@v4
        with:
          name: trading-host-image
          path: /tmp

      - name: Load trading-host image
        run: docker load -i /tmp/trading-host-image.tar

      - name: Bring up real stack (matching-platform + marketdata + trading-host)
        # docker-compose.real.yml flips trading-host to Mode=Real, adds
        # the matching-platform service, and (since v1) the marketdata-live
        # service consuming matching's UMDF unicast — so trading-host's
        # IReferencePrice is wired through MarketDataReferencePrice end-to-end
        # instead of falling back to the static map. Conformance overlay still
        # piles on the carol admin seed. --wait blocks until matching's
        # healthcheck passes AND trading-host reports healthy (FIXP Negotiate
        # succeeded against matching). Trading-host image is preloaded from
        # the artifact; only upstream images are pulled.
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              up -d --wait trading-host

      - name: Run conformance
        # Per RFC integration-real-stack-v0 §4.7: auth + admin/firms +
        # risk-rejection-shape exercise the real wire; simulator + algo
        # specs auto-skip on RequiresSimulator (no Mode=Simulator).
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              run --build --rm conformance

      - name: Logs (always)
        if: always()
        run: |
          for svc in trading-host matching-platform marketdata-live; do
            echo "::group::$svc"
            docker compose \
                -f docker/docker-compose.yml \
                -f docker/docker-compose.real.yml \
                -f docker/docker-compose.conformance.yml \
                logs --no-color --timestamps "$svc" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              down -v
