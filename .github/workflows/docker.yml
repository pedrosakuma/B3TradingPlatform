name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  required-ci:
    name: Require CI success for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for required CI
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            run="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=10" \
              --jq '.workflow_runs | sort_by(.run_number) | last // {}')"
            status="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' <<<"$run")"
            conclusion="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion",""))' <<<"$run")"
            url="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("html_url",""))' <<<"$run")"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "Required CI succeeded: $url"
                exit 0
              fi
              echo "ERROR: required CI concluded '$conclusion': $url" >&2
              exit 1
            fi
            echo "Waiting for required CI for $SHA (status=${status:-not-started})"
            sleep 15
          done
          echo "ERROR: required CI did not complete successfully within 20 minutes" >&2
          exit 1

      - name: Pull request build does not publish
        if: github.event_name == 'pull_request'
        run: echo "PR validation only; image promotion is disabled."

  trading-host:
    name: Build candidate images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      host_digest: ${{ steps.host-candidate.outputs.digest }}
      frontend_digest: ${{ steps.frontend-candidate.outputs.digest }}
      market_maker_bot_digest: ${{ steps.market-maker-bot-candidate.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute PR image metadata
        if: github.event_name == 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-trading-host
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Validate pull-request host build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/src/B3.Trading.Host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trading-host
          cache-to:   type=gha,scope=trading-host,mode=max

      - name: Build immutable host candidate
        if: github.event_name != 'pull_request'
        id: host-candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/src/B3.Trading.Host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/b3-trading-host:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=trading-host
          cache-to: type=gha,scope=trading-host,mode=max

      - name: Build immutable frontend candidate
        if: github.event_name != 'pull_request'
        id: frontend-candidate
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/b3-trading-frontend:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Compute PR market-maker-bot image metadata
        if: github.event_name == 'pull_request'
        id: mm-bot-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-market-maker-bot
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Validate pull-request market-maker-bot build
        # #683/#687 follow-up: the bot was only ever built ephemerally
        # inside the market-maker-conformance job (`docker compose build`),
        # never published — an operator standing up the overlay outside
        # CI had to build it locally too. Give it the same
        # candidate/promote treatment as trading-host and the frontend.
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/tools/B3.Trading.MarketMakerBot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.mm-bot-meta.outputs.tags }}
          labels: ${{ steps.mm-bot-meta.outputs.labels }}
          cache-from: type=gha,scope=market-maker-bot
          cache-to:   type=gha,scope=market-maker-bot,mode=max

      - name: Build immutable market-maker-bot candidate
        if: github.event_name != 'pull_request'
        id: market-maker-bot-candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/tools/B3.Trading.MarketMakerBot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/b3-market-maker-bot:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=market-maker-bot
          cache-to: type=gha,scope=market-maker-bot,mode=max

  identity-directory-arm64-smoke:
    name: ARM64 identity directory smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: trading-host
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build pull-request linux/arm64 smoke image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/src/B3.Trading.Host/Dockerfile
          platforms: linux/arm64
          load: true
          tags: b3-trading-host:identity-arm64-smoke
          cache-from: type=gha,scope=trading-host-arm64-smoke
          cache-to:   type=gha,scope=trading-host-arm64-smoke,mode=max

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot and query SQLite identity directory
        env:
          TRADING_AUTH_SIGNING_KEY: ci-arm64-smoke-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
          CANDIDATE_DIGEST: ${{ needs.trading-host.outputs.host_digest }}
          HOST_IMAGE: ghcr.io/${{ github.repository_owner }}/b3-trading-host
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            image_ref="b3-trading-host:identity-arm64-smoke"
          else
            test -n "$CANDIDATE_DIGEST"
            image_ref="$HOST_IMAGE@$CANDIDATE_DIGEST"
          fi
          cid="$(docker run -d --platform linux/arm64 -p 18080:5000 \
            -e Trading__Auth__SigningKey="$TRADING_AUTH_SIGNING_KEY" \
            -e Trading__Auth__Users__0__Username=alice \
            -e Trading__Auth__Users__0__PasswordHash="$TRADING_SEED_PASSWORD_HASH" \
            -e Trading__Auth__Users__0__Salt="$TRADING_SEED_PASSWORD_SALT" \
            -e Trading__Auth__Users__0__Iterations=600000 \
            -e Trading__Auth__Users__0__Role=user \
            -e Trading__Auth__Users__0__Firm=FIRM01 \
            -e Trading__Reports__Cvm__OwnerHashSalt=ci-arm64-cvm-salt \
            -e Trading__DropCopy__ClOrdIdMaskSalt=ci-arm64-clordid-mask-salt \
            "$image_ref")"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/live
          curl --fail --silent http://127.0.0.1:18080/health | grep '"provider":"Sqlite"'
          docker exec "$cid" test -f /var/lib/b3trading/identity/users.db
          backup_metadata="$(docker exec "$cid" dotnet /app/tools/identity-maintenance/B3.Trading.IdentityMaintenance.dll backup \
            --database /var/lib/b3trading/identity/users.db \
            --destination /var/lib/b3trading/identity/identity-backup.db)"
          echo "$backup_metadata" | grep '"command":"backup"'
          echo "$backup_metadata" | grep '"schemaVersion":2'
          validate_metadata="$(docker exec "$cid" dotnet /app/tools/identity-maintenance/B3.Trading.IdentityMaintenance.dll validate \
            --database /var/lib/b3trading/identity/identity-backup.db)"
          echo "$validate_metadata" | grep '"command":"validate"'
          echo "$validate_metadata" | grep '"schemaVersion":2'
          docker stats --no-stream --format 'identity-arm64-smoke cpu={{.CPUPerc}} memory={{.MemUsage}}' "$cid"

  frontend:
    name: Validate frontend image build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-trading-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

  candidate-runtime-smoke:
    name: Smoke candidate manifests (AMD64 + ARM64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: trading-host
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke host digest on AMD64 and ARM64
        env:
          HOST_DIGEST: ${{ needs.trading-host.outputs.host_digest }}
          HOST_IMAGE: ghcr.io/${{ github.repository_owner }}/b3-trading-host
        run: |
          set -euo pipefail
          test -n "$HOST_DIGEST"
          for entry in "linux/amd64:18080" "linux/arm64:18081"; do
            platform="${entry%%:*}"
            port="${entry##*:}"
            cid="$(docker run -d --platform "$platform" -p "${port}:5000" \
              -e Trading__Auth__SigningKey=ci-digest-smoke-key-min-32-bytes-long \
              -e Trading__Reports__Cvm__OwnerHashSalt=ci-digest-cvm-salt \
              -e Trading__DropCopy__ClOrdIdMaskSalt=ci-digest-clordid-mask-salt \
              "$HOST_IMAGE@$HOST_DIGEST")"
            trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
            for i in $(seq 1 90); do
              if curl --fail --silent "http://127.0.0.1:${port}/live" >/dev/null; then
                break
              fi
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:${port}/live"
            docker rm -f "$cid" >/dev/null
            docker image rm "$HOST_IMAGE@$HOST_DIGEST" >/dev/null 2>&1 || true
            trap - EXIT
          done

      - name: Smoke frontend digest on AMD64 and ARM64
        env:
          FRONTEND_DIGEST: ${{ needs.trading-host.outputs.frontend_digest }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/b3-trading-frontend
        run: |
          set -euo pipefail
          test -n "$FRONTEND_DIGEST"
          for entry in "linux/amd64:18082" "linux/arm64:18083"; do
            platform="${entry%%:*}"
            port="${entry##*:}"
            cid="$(docker run -d --platform "$platform" -p "${port}:80" \
              "$FRONTEND_IMAGE@$FRONTEND_DIGEST")"
            trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
            for i in $(seq 1 60); do
              if curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null; then
                break
              fi
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
            docker rm -f "$cid" >/dev/null
            docker image rm "$FRONTEND_IMAGE@$FRONTEND_DIGEST" >/dev/null 2>&1 || true
            trap - EXIT
          done

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: docker compose config
        # The compose file requires a few env vars (?: validators); set
        # placeholders just to satisfy parsing. We're testing structure,
        # not runtime.
        env:
          TRADING_AUTH_SIGNING_KEY: validate-only-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
          TRADING_SEED_USER_2: soak-counterparty
          ALERT_SMOKE_RUN_ID: validate
          MM_SOAK_COUNTERPARTY_USER: soak-counterparty
          MM_SOAK_ADMIN_USER: soak-admin
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.unavailable.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.observability.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.observability.yml -f docker/docker-compose.alert-smoke.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.conformance.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.demo.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.market-maker.yml config --quiet
          AUTH_MODE=Entra MM_SOAK_PROJECT_NAME=validate-mm-soak docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.market-maker.yml \
            -f docker/docker-compose.observability.yml \
            -f docker/docker-compose.market-maker-soak.yml \
            config --format json |
            jq -e '
              .services["trading-host"].environment.Trading__Auth__Mode == "Local" and
              .services["trading-host"].environment.Trading__Auth__LocalLoginEnabled == "true" and
              .services["trading-host"].environment.Trading__Auth__Users__5__Username == "soak-counterparty" and
              .services["trading-host"].environment.Trading__Auth__Users__8__Username == "soak-admin" and
              .services["trading-host"].environment["Trading__Risk__PerEndClient__soak-counterparty__AllowShortSell"] == "true"
            ' >/dev/null
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.real.yml -f docker/docker-compose.market-maker.yml -f docker/docker-compose.conformance.yml -f docker/docker-compose.market-maker-conformance.yml config --quiet

      - name: docker compose auth mode wiring smoke
        run: python3 docker/test/compose-auth-config-smoke.py

      - name: market-maker soak helper self-tests
        run: scripts/soak/test-market-maker-soak-lib.sh

      - name: docker compose config (Hybrid auth mapping)
        env:
          TRADING_AUTH_SIGNING_KEY: validate-only-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
          AUTH_MODE: Hybrid
          AUTH_AUTHORITY: https://tenant.ciamlogin.com/tenant-id/v2.0
          AUTH_ISSUER: https://tenant.ciamlogin.com/tenant-id/v2.0
          AUTH_TENANT_ID: tenant-id
          AUTH_CLIENT_ID: spa-client-id
          AUTH_API_SCOPE: api://trading/access_as_user
          AUTH_API_AUDIENCE: api://trading
          AUTH_REQUIRED_SCOPE: access_as_user
          AUTH_REDIRECT_URI: http://localhost:8080/
          AUTH_LOGOUT_URI: http://localhost:8080/
          AUTH_KNOWN_AUTHORITIES: tenant.ciamlogin.com
        run: |
          set -euo pipefail
          rendered="$(docker compose -f docker/docker-compose.yml config)"
          printf '%s\n' "$rendered" | grep -q 'Trading__Auth__Mode: Hybrid'
          printf '%s\n' "$rendered" | grep -q 'AUTH_MODE: Hybrid'
          printf '%s\n' "$rendered" | grep -q 'Trading__Auth__ExternalIdentity__Authority: https://tenant.ciamlogin.com/tenant-id/v2.0'
          printf '%s\n' "$rendered" | grep -q 'Trading__Auth__ExternalIdentity__Issuer: https://tenant.ciamlogin.com/tenant-id/v2.0'
          printf '%s\n' "$rendered" | grep -q 'Trading__Auth__ExternalIdentity__TenantId: tenant-id'
          printf '%s\n' "$rendered" | grep -q 'Trading__Auth__ExternalIdentity__Audience: api://trading'
          printf '%s\n' "$rendered" | grep -q 'Trading__Auth__ExternalIdentity__RequiredScope: access_as_user'
          printf '%s\n' "$rendered" | grep -q 'Trading__Auth__ExternalIdentity__AllowedClientApplicationIds__0: spa-client-id'

      - name: docker compose config (er-injection overlay)
        # The er-injection overlay (#259, Q1.7) requires a per-run admin
        # PBKDF2 triple via `${VAR:?}` interpolation (see
        # docker/docker-compose.er-injection.yml header). Mirror the
        # placeholders the manual conformance workflow uses so the
        # validate step can parse the merged file. Validate-only — never
        # used to actually boot the host in this job.
        env:
          TRADING_AUTH_SIGNING_KEY: validate-only-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
          B3T_CONFORMANCE_ADMIN_PASSWORD: ci-conformance-2024-do-not-use-in-prod
          B3T_CONFORMANCE_ADMIN_PASSWORD_HASH: YPCvuCrUq4h6e8ebNKvxRAda8DWQdOf+0uakwAxar9E=
          B3T_CONFORMANCE_ADMIN_PASSWORD_SALT: Q0lDb25mb3JtYW5jZTE2Qg==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.er-injection.yml \
              config --quiet

      - name: docker compose config (public overlay)
        # The public overlay (#531) fails closed: every secret/cert uses
        # `${VAR:?}`. Set validate-only placeholders so the merged file
        # parses. Validate-only — never boots the host.
        env:
          TRADING_AUTH_SIGNING_KEY: validate-only-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
          TRADING_CVM_OWNER_HASH_SALT: validate-only-cvm-salt
          TRADING_CLORDID_MASK_SALT: validate-only-clordid-mask-salt
          TRADING_OUTBOUND_KEY_ID: validate-only-outbound
          TRADING_OUTBOUND_KEY_BASE64: N2tjXhiFZ61TrXVa78oABf6mKVhmZV9xV4IxWA4QB9Y=
          PUBLIC_FIXP_TLS_DIR: /opt/fixp-tls
          PUBLIC_FIXP_TLS_CERT: /etc/ssl/fixp/server.pfx
          PUBLIC_FIXP_CA_BUNDLE: /etc/ssl/fixp/bot-ca-bundle.pem
          PUBLIC_FIXP_CA_DENYLIST: /etc/ssl/fixp/bot-denylist.txt
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.public.yml \
              config --quiet

  alerting:
    name: Prometheus rules and receiver smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Test rules and deliver synthetic alert
        run: scripts/observability/test-alerting.sh

  recovery-drill:
    name: Real-mode backup, restore, and trade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: trading-host
    env:
      TRADING_AUTH_SIGNING_KEY: ci-recovery-drill-placeholder-key-min-32-bytes-long
      TRADING_SEED_USER: alice
      TRADING_SEED_PASSWORD: wonderland
      TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
      TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start real stack
        env:
          CANDIDATE_DIGEST: ${{ needs.trading-host.outputs.host_digest }}
          HOST_IMAGE: ghcr.io/${{ github.repository_owner }}/b3-trading-host
        run: |
          set -euo pipefail
          compose=(
            docker compose
            -f docker/docker-compose.yml
            -f docker/docker-compose.real.yml
            -f docker/docker-compose.conformance.yml
            -f docker/docker-compose.real-conformance.yml
          )
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            "${compose[@]}" up -d --build --wait trading-host
          else
            test -n "$CANDIDATE_DIGEST"
            export TRADING_IMAGE="$HOST_IMAGE@$CANDIDATE_DIGEST"
            docker pull "$TRADING_IMAGE"
            "${compose[@]}" up -d --no-build --wait trading-host
            test "$(docker inspect -f '{{.Config.Image}}' b3-trading-host)" = "$TRADING_IMAGE"
          fi

      - name: Seed durable state
        run: |
          set -euo pipefail
          token="$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"username":"alice","password":"wonderland"}' \
            http://127.0.0.1:5000/api/auth/login \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          created="$(curl --fail --silent \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"label":"release-gate-recovery-drill"}' \
            http://127.0.0.1:5000/api/user-bot-credentials/)"
          credential_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$created")"
          test -n "$credential_id"
          echo "RECOVERY_CREDENTIAL_ID=$credential_id" >>"$GITHUB_ENV"

      - name: Quiesce, restore durable identity, and trade
        run: scripts/backup/backup-and-restore-drill.sh

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-recovery-${{ github.sha }}
          path: backup-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Logs
        if: failure()
        run: docker logs b3-trading-host || true

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.real.yml \
            -f docker/docker-compose.conformance.yml \
            -f docker/docker-compose.real-conformance.yml \
            down -v || true

  conformance:
    name: Run conformance against candidate (unavailable mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: trading-host
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring up trading-host
        env:
          # alice/wonderland — the committed hash/salt match this plaintext.
          # Signing key is a CI-only placeholder; conformance only checks
          # the round-trip works, not that the key is unique.
          # The unavailable.yml overlay flips trading-host back to
          # Mode=Unavailable (the pre-default-Real posture) so this job
          # exercises the no-broker fail-closed contract — admin/firms
          # CRUD, auth, risk-rejection-shape — without spinning up
          # matching-platform. The real-stack-conformance job below
          # covers the Mode=Real wire end-to-end.
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_USER: alice
          TRADING_SEED_PASSWORD: wonderland
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
          CANDIDATE_DIGEST: ${{ needs.trading-host.outputs.host_digest }}
          HOST_IMAGE: ghcr.io/${{ github.repository_owner }}/b3-trading-host
        run: |
          set -euo pipefail
          compose=(
            docker compose
            -f docker/docker-compose.yml
            -f docker/docker-compose.unavailable.yml
            -f docker/docker-compose.conformance.yml
          )
          "${compose[@]}" build conformance
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            "${compose[@]}" up -d --build --wait trading-host
          else
            test -n "$CANDIDATE_DIGEST"
            export TRADING_IMAGE="$HOST_IMAGE@$CANDIDATE_DIGEST"
            docker pull "$TRADING_IMAGE"
            "${compose[@]}" up -d --no-build --wait trading-host
            test "$(docker inspect -f '{{.Config.Image}}' b3-trading-host)" = "$TRADING_IMAGE"
          fi

      - name: Run conformance
        env:
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_USER: alice
          TRADING_SEED_PASSWORD: wonderland
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.unavailable.yml \
              -f docker/docker-compose.conformance.yml \
              run --rm --no-deps conformance

      - name: Trading-host logs (always)
        if: always()
        env:
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.unavailable.yml \
              -f docker/docker-compose.conformance.yml \
              logs trading-host || true

      - name: Tear down
        if: always()
        env:
          TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
          TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
          TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.unavailable.yml \
              -f docker/docker-compose.conformance.yml \
              down -v

  real-stack-conformance:
    name: Run conformance against candidate (real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: trading-host
    env:
      # Same CI placeholders as the conformance job above (alice/wonderland).
      TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
      TRADING_SEED_USER: alice
      TRADING_SEED_PASSWORD: wonderland
      TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
      TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring up real stack (matching-platform + marketdata + trading-host)
        # docker-compose.real.yml flips trading-host to Mode=Real, adds
        # the matching-platform service, and (since v1) the marketdata-live
        # service consuming matching's UMDF unicast — so trading-host's
        # IReferencePrice is wired through MarketDataReferencePrice end-to-end
        # instead of falling back to the static map. Conformance overlay still
        # piles on the carol admin seed. real-conformance.yml opts the run
        # into RequiresSandboxMatching specs (separate file so non-conformance
        # combos like real+demo don't trip a "service has no image" validation
        # on a partial conformance fragment). --wait blocks until matching's
        # healthcheck passes AND trading-host reports healthy (FIXP Negotiate
        # succeeded against matching).
        env:
          CANDIDATE_DIGEST: ${{ needs.trading-host.outputs.host_digest }}
          HOST_IMAGE: ghcr.io/${{ github.repository_owner }}/b3-trading-host
        run: |
          set -euo pipefail
          compose=(
            docker compose
            -f docker/docker-compose.yml
            -f docker/docker-compose.real.yml
            -f docker/docker-compose.conformance.yml
            -f docker/docker-compose.real-conformance.yml
          )
          "${compose[@]}" build conformance
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            "${compose[@]}" up -d --build --wait trading-host
          else
            test -n "$CANDIDATE_DIGEST"
            export TRADING_IMAGE="$HOST_IMAGE@$CANDIDATE_DIGEST"
            docker pull "$TRADING_IMAGE"
            "${compose[@]}" up -d --no-build --wait trading-host
            test "$(docker inspect -f '{{.Config.Image}}' b3-trading-host)" = "$TRADING_IMAGE"
          fi

      - name: Run conformance
        # Per RFC integration-real-stack-v0 §4.7: auth + admin/firms +
        # risk-rejection-shape exercise the real wire; ER-injection +
        # algo specs auto-skip on RequiresErInjection (host doesn't set
        # AllowErInjection in the real-stack profile, #163).
        # `--no-deps` is critical: without it, `docker compose run` will
        # recreate trading-host (and its FIXP session) between the
        # `up --wait` step and conformance execution, which leaves the
        # SDK trying to reuse SessionVerId=1 against a matching that
        # already saw last-seen=1, producing a permanent negotiate-reject
        # loop and the spec timing out at `sessionState=terminating`.
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.real-conformance.yml \
              run --rm --no-deps conformance

      - name: Logs (always)
        if: always()
        run: |
          for svc in trading-host matching-platform marketdata; do
            echo "::group::$svc"
            docker compose \
                -f docker/docker-compose.yml \
                -f docker/docker-compose.real.yml \
                -f docker/docker-compose.conformance.yml \
                -f docker/docker-compose.real-conformance.yml \
                logs --no-color --timestamps "$svc" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.real-conformance.yml \
              down -v

  market-maker-conformance:
    name: Run conformance against candidate (market-maker sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: trading-host
    env:
      # Same CI placeholders as the conformance jobs above (alice/wonderland).
      TRADING_AUTH_SIGNING_KEY: ci-conformance-placeholder-key-min-32-bytes-long-aaaaa
      TRADING_SEED_USER: alice
      TRADING_SEED_PASSWORD: wonderland
      TRADING_SEED_PASSWORD_HASH: ZDzDHANAHq8NDQK3BWk/YZjybKLCMKdRzw0z9Da5wic=
      TRADING_SEED_PASSWORD_SALT: rXA+be7/gEYYZQrQDsUr2g==
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring up real stack + market-maker bot (#683 item 4)
        # Same real-stack bring-up as real-stack-conformance, plus
        # docker-compose.market-maker.yml (bot + AllowSelfCashDeposit).
        # Deliberately its own job/stack — see
        # docker-compose.market-maker-conformance.yml's header comment for
        # why this can't share an order book with the RequiresSandboxMatching
        # specs. --wait blocks until matching's healthcheck passes AND
        # trading-host reports healthy; the bot itself only needs
        # matching-platform healthy + marketdata started (see its
        # depends_on), so it's up well before conformance runs.
        #
        # On push events, pull the immutable market-maker-bot candidate
        # the trading-host job just built/pushed instead of rebuilding it
        # here from source (mirrors trading-host's own candidate-pull
        # pattern) — this is the run that proves the published image
        # actually boots and negotiates, not just that it compiles.
        env:
          CANDIDATE_DIGEST: ${{ needs.trading-host.outputs.host_digest }}
          HOST_IMAGE: ghcr.io/${{ github.repository_owner }}/b3-trading-host
          MM_BOT_CANDIDATE_DIGEST: ${{ needs.trading-host.outputs.market_maker_bot_digest }}
          MM_BOT_IMAGE: ghcr.io/${{ github.repository_owner }}/b3-market-maker-bot
        run: |
          set -euo pipefail
          compose=(
            docker compose
            -f docker/docker-compose.yml
            -f docker/docker-compose.real.yml
            -f docker/docker-compose.market-maker.yml
            -f docker/docker-compose.conformance.yml
            -f docker/docker-compose.market-maker-conformance.yml
          )
          "${compose[@]}" build conformance
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            "${compose[@]}" build market-maker-bot
            "${compose[@]}" up -d --build --wait trading-host market-maker-bot
          else
            test -n "$CANDIDATE_DIGEST"
            test -n "$MM_BOT_CANDIDATE_DIGEST"
            export TRADING_IMAGE="$HOST_IMAGE@$CANDIDATE_DIGEST"
            export MARKET_MAKER_BOT_IMAGE="$MM_BOT_IMAGE@$MM_BOT_CANDIDATE_DIGEST"
            docker pull "$TRADING_IMAGE"
            docker pull "$MARKET_MAKER_BOT_IMAGE"
            "${compose[@]}" up -d --no-build --wait trading-host
            "${compose[@]}" up -d --no-build market-maker-bot
            test "$(docker inspect -f '{{.Config.Image}}' b3-trading-host)" = "$TRADING_IMAGE"
            test "$(docker inspect -f '{{.Config.Image}}' b3-market-maker-bot)" = "$MARKET_MAKER_BOT_IMAGE"
          fi

      - name: Run conformance
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.market-maker.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.market-maker-conformance.yml \
              run --rm --no-deps conformance

      - name: Logs (always)
        if: always()
        run: |
          for svc in trading-host matching-platform marketdata market-maker-bot; do
            echo "::group::$svc"
            docker compose \
                -f docker/docker-compose.yml \
                -f docker/docker-compose.real.yml \
                -f docker/docker-compose.market-maker.yml \
                -f docker/docker-compose.conformance.yml \
                -f docker/docker-compose.market-maker-conformance.yml \
                logs --no-color --timestamps "$svc" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: |
          docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.real.yml \
              -f docker/docker-compose.market-maker.yml \
              -f docker/docker-compose.conformance.yml \
              -f docker/docker-compose.market-maker-conformance.yml \
              down -v

  outbound-recovery-release-gate:
    name: Outbound recovery conformance release gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - recovery-drill
      - conformance
      - real-stack-conformance
      - market-maker-conformance
    steps:
      - name: Require every outbound recovery profile
        env:
          RECOVERY_DRILL: ${{ needs.recovery-drill.result }}
          UNAVAILABLE_CONFORMANCE: ${{ needs.conformance.result }}
          REAL_STACK_CONFORMANCE: ${{ needs.real-stack-conformance.result }}
          MARKET_MAKER_CONFORMANCE: ${{ needs.market-maker-conformance.result }}
        run: |
          set -euo pipefail
          test "$RECOVERY_DRILL" = success
          test "$UNAVAILABLE_CONFORMANCE" = success
          test "$REAL_STACK_CONFORMANCE" = success
          test "$MARKET_MAKER_CONFORMANCE" = success

  promote:
    name: Promote tested image digests
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.required-ci.result == 'success' &&
      needs.trading-host.result == 'success' &&
      needs.candidate-runtime-smoke.result == 'success' &&
      needs.identity-directory-arm64-smoke.result == 'success' &&
      needs.compose-validate.result == 'success' &&
      needs.alerting.result == 'success' &&
      needs.recovery-drill.result == 'success' &&
      needs.conformance.result == 'success' &&
      needs.real-stack-conformance.result == 'success' &&
      needs.market-maker-conformance.result == 'success' &&
      needs.outbound-recovery-release-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - required-ci
      - trading-host
      - candidate-runtime-smoke
      - identity-directory-arm64-smoke
      - compose-validate
      - alerting
      - recovery-drill
      - conformance
      - real-stack-conformance
      - market-maker-conformance
      - outbound-recovery-release-gate
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute host promotion tags
        id: host-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-trading-host
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute frontend promotion tags
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-trading-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Promote tested host digest
        env:
          DIGEST: ${{ needs.trading-host.outputs.host_digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/b3-trading-host
          TAGS: ${{ steps.host-meta.outputs.tags }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
          done <<<"$TAGS"

      - name: Promote tested frontend digest
        env:
          DIGEST: ${{ needs.trading-host.outputs.frontend_digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/b3-trading-frontend
          TAGS: ${{ steps.frontend-meta.outputs.tags }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
          done <<<"$TAGS"

      - name: Compute market-maker-bot promotion tags
        id: market-maker-bot-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/b3-market-maker-bot
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Promote tested market-maker-bot digest
        # market-maker-conformance already proved this exact digest boots
        # and negotiates against the real stack (see that job's bring-up
        # step) — same tested-artifact promotion as host/frontend above,
        # just no rebuild.
        env:
          DIGEST: ${{ needs.trading-host.outputs.market_maker_bot_digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/b3-market-maker-bot
          TAGS: ${{ steps.market-maker-bot-meta.outputs.tags }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
          done <<<"$TAGS"
