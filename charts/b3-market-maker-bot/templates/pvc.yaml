apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "b3-market-maker-bot.fullname" . }}-state
  labels:
    {{- include "b3-market-maker-bot.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
