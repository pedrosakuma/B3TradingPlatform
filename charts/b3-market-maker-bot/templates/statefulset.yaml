apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "b3-market-maker-bot.fullname" . }}
  labels:
    {{- include "b3-market-maker-bot.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "b3-market-maker-bot.fullname" . }}
  # Hardcoded to 1 — see values.yaml replicaCount comment. The bot's FIXP
  # session (sessionId/sessionVerId below) is single-writer against
  # matching-platform, same posture as b3-trading-host's WAL; a
  # volumeClaimTemplates-backed StatefulSet (rather than a bare
  # Deployment + standalone PVC) both matches that chart's precedent and
  # means the PVC survives `helm uninstall`/reinstall instead of being
  # deleted as a chart-owned resource — losing the session-state
  # watermark would otherwise wedge the bot in a permanent
  # SessionVerId-reuse reconnect loop against matching-platform.
  replicas: 1
  selector:
    matchLabels:
      {{- include "b3-market-maker-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "b3-market-maker-bot.labels" . | nindent 8 }}
    spec:
      # The image runs as non-root uid/gid 10001 (bot). The mounted PVC
      # roots as root:root, so fsGroup is REQUIRED — see values.yaml
      # securityContext comment.
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: market-maker-bot
          image: {{ include "b3-market-maker-bot.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # ── FIXP session ─────────────────────────────────────────────
            - name: MarketMaker__Endpoint
              value: {{ .Values.session.endpoint | quote }}
            - name: MarketMaker__SessionId
              value: {{ .Values.session.sessionId | quote }}
            - name: MarketMaker__SessionVerId
              value: {{ .Values.session.sessionVerId | quote }}
            - name: MarketMaker__EnteringFirm
              value: {{ .Values.session.enteringFirm | quote }}
            - name: MarketMaker__AccessKey
              value: {{ .Values.session.accessKey | quote }}
            - name: MarketMaker__SenderLocation
              value: {{ .Values.session.senderLocation | quote }}
            - name: MarketMaker__EnteringTrader
              value: {{ .Values.session.enteringTrader | quote }}
            # ── Market data (best-effort quote anchor) ──────────────────
            - name: MarketMaker__MarketData__WsUrl
              value: {{ .Values.marketData.wsUrl | quote }}
            # ── Behaviour ────────────────────────────────────────────────
            - name: MarketMaker__StateDirectory
              value: /var/lib/b3-market-maker-bot
            - name: MarketMaker__ReconcileInterval
              value: {{ .Values.behaviour.reconcileInterval | quote }}
            # ── Position/P&L observability ────────────────────────────────
            - name: MarketMaker__Telemetry__SnapshotInterval
              value: {{ .Values.observability.snapshotInterval | quote }}
            - name: MarketMaker__Telemetry__MarkMaxAge
              value: {{ .Values.observability.markMaxAge | quote }}
            {{- if .Values.observability.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.observability.otlpProtocol | quote }}
            {{- end }}
            # ── Instruments (must match matching's instruments-eqt.json) ─
            {{- range $i, $instrument := .Values.instruments }}
            {{- $inventorySkew := default (dict) $instrument.inventorySkew }}
            {{- $volatilitySpread := default (dict) $instrument.volatilitySpread }}
            - name: {{ printf "MarketMaker__Instruments__%d__Symbol" $i }}
              value: {{ $instrument.symbol | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__SecurityId" $i }}
              value: {{ $instrument.securityId | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__RefPrice" $i }}
              value: {{ $instrument.refPrice | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__TickSize" $i }}
              value: {{ $instrument.tickSize | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__LotSize" $i }}
              value: {{ $instrument.lotSize | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__QuoteLots" $i }}
              value: {{ $instrument.quoteLots | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__SpreadTicks" $i }}
              value: {{ $instrument.spreadTicks | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__InventorySkew__Enabled" $i }}
              value: {{ dig "enabled" false $inventorySkew | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__InventorySkew__FullSkewAtLots" $i }}
              value: {{ dig "fullSkewAtLots" 10 $inventorySkew | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__InventorySkew__MaxSkewTicks" $i }}
              value: {{ dig "maxSkewTicks" 5 $inventorySkew | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__VolatilitySpread__Enabled" $i }}
              value: {{ dig "enabled" false $volatilitySpread | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__VolatilitySpread__Window" $i }}
              value: {{ dig "window" "00:01:00" $volatilitySpread | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__VolatilitySpread__MaxSamples" $i }}
              value: {{ dig "maxSamples" 120 $volatilitySpread | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__VolatilitySpread__MinSamples" $i }}
              value: {{ dig "minSamples" 10 $volatilitySpread | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__VolatilitySpread__Multiplier" $i }}
              value: {{ dig "multiplier" 1.0 $volatilitySpread | quote }}
            - name: {{ printf "MarketMaker__Instruments__%d__VolatilitySpread__MaxAdditionalSpreadTicks" $i }}
              value: {{ dig "maxAdditionalSpreadTicks" 20 $volatilitySpread | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/b3-market-maker-bot
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
