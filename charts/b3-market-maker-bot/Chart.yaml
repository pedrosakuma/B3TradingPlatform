apiVersion: v2
name: b3-market-maker-bot
description: >-
  B3TradingPlatform market-maker-bot — a co-located FIXP client (#683,
  evolved from the simulator-bot in #134) that submits one resting bid +
  one resting ask per configured instrument against matching-platform, so
  sandbox/demo instruments always have a market to trade against. Ships a
  single-replica StatefulSet with a small RWO PVC (via
  volumeClaimTemplates, so it survives helm uninstall/reinstall) for its
  per-session
  ClOrdID watermark state; no Service/ports (it's an outbound-only FIXP +
  WebSocket client, nothing connects to it).
type: application
# Chart version is released in lockstep with the image (see #568 versioning
# contract, extended here per #683 follow-up): bump this whenever
# templates/values change, independent of appVersion.
version: 0.3.0
# appVersion tracks the validated ghcr.io/pedrosakuma/b3-market-maker-bot
# image tag this chart was last verified against. Overridable per-release
# via values.image.tag; .Chart.AppVersion IS used as the default image tag
# when values.image.tag is empty, see templates/_helpers.tpl.
appVersion: "0.1.0"
home: https://github.com/pedrosakuma/B3TradingPlatform
sources:
  - https://github.com/pedrosakuma/B3TradingPlatform
keywords:
  - b3
  - trading
  - market-maker
  - fixp
maintainers:
  - name: pedrosakuma
