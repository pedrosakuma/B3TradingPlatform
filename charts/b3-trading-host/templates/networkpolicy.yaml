{{- if .Values.networkPolicy.enabled }}
# Admits ingress to trading-host:5000 from the frontend only. Deploy the
# companion default-deny-ingress NetworkPolicy at the namespace level (or via
# your own baseline) — this chart only owns the trading-host-scoped allow
# rule, matching the b3deploy@3b4c1d9 topology this chart replaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "b3-trading-host.fullname" . }}-ingress
  labels:
    {{- include "b3-trading-host.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "b3-trading-host.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.frontendPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
