{{- if .Values.keyVault.name }}
# SecretProviderClass — pulls trading-host's secrets from Azure Key Vault via
# the AKS CSI Secrets Store add-on and syncs them into the
# "<fullname>-secrets" k8s Secret (secretObjects), consumed by the
# StatefulSet via secretKeyRef.
#
# AGENTS.md: secrets live in Key Vault, referenced (CSI), never inlined. Seed
# the Key Vault objects named below before installing this chart
# (az keyvault secret set ...):
#   {{ .Values.keyVault.objectNames.signingKey }}       (>= 32 UTF-8 bytes, NOT a dev default)
#   {{ .Values.keyVault.objectNames.seedPasswordHash }}
#   {{ .Values.keyVault.objectNames.seedPasswordSalt }}
#   {{ .Values.keyVault.objectNames.cvmOwnerHashSalt }}
#   {{ .Values.keyVault.objectNames.clordidMaskSalt }}
# seedPasswordHash/seedPasswordSalt are also the temporary local-admin
# bootstrap/break-glass password material during Hybrid rollout. The identity
# SQLite PVC stores authorization rows only, never password material.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "b3-trading-host.fullname" . }}-secrets
  labels:
    {{- include "b3-trading-host.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ include "b3-trading-host.fullname" . }}-secrets
      type: Opaque
      data:
        - objectName: {{ .Values.keyVault.objectNames.signingKey }}
          key: signing-key
        - objectName: {{ .Values.keyVault.objectNames.seedPasswordHash }}
          key: seed-password-hash
        - objectName: {{ .Values.keyVault.objectNames.seedPasswordSalt }}
          key: seed-password-salt
        - objectName: {{ .Values.keyVault.objectNames.cvmOwnerHashSalt }}
          key: cvm-owner-hash-salt
        - objectName: {{ .Values.keyVault.objectNames.clordidMaskSalt }}
          key: clordid-mask-salt
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.keyVault.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.keyVault.objectNames.signingKey }}
          objectType: secret
        - |
          objectName: {{ .Values.keyVault.objectNames.seedPasswordHash }}
          objectType: secret
        - |
          objectName: {{ .Values.keyVault.objectNames.seedPasswordSalt }}
          objectType: secret
        - |
          objectName: {{ .Values.keyVault.objectNames.cvmOwnerHashSalt }}
          objectType: secret
        - |
          objectName: {{ .Values.keyVault.objectNames.clordidMaskSalt }}
          objectType: secret
{{- end }}
