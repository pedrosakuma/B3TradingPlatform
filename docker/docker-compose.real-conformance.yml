# Tiny merge overlay for the (real-stack + conformance) combination.
#
# The conformance service is defined in docker-compose.conformance.yml.
# When stacked on top of docker-compose.real.yml, set the env flag that
# opts the run into RequiresSandboxMatching specs (e.g. ReferencePriceLiveSpec).
# Any non-real conformance run keeps skipping them at discovery time.
#
# Usage:
#   docker compose \
#       -f docker/docker-compose.yml \
#       -f docker/docker-compose.real.yml \
#       -f docker/docker-compose.conformance.yml \
#       -f docker/docker-compose.real-conformance.yml \
#       run --rm conformance
#
# Kept as a separate file so docker-compose.real.yml can be combined with
# overlays that don't define a `conformance` service (e.g. demo) without
# tripping compose's "service has neither image nor build" validation.
services:
  conformance:
    environment:
      B3T_REAL_STACK_CONFORMANCE: "true"

  # The ReferencePriceLiveSpec scenario crosses Buy+Sell from a single
  # authenticated end-client (alice) so matching can print a trade and
  # the live ref-price cache can be observed displacing the static
  # fallback. With the NoNakedShortCheck gate enabled by default in
  # the real overlay (protects ad-hoc dogfooding), alice's Sell would
  # otherwise be risk-rejected before reaching matching ("current
  # long=0, open sell leaves=100"). Opt alice out here, scoped to the
  # conformance run only — the gate stays armed for every other user
  # in this stack.
  trading-host:
    environment:
      Trading__Risk__PerEndClient__alice__AllowShortSell: "true"
      # Same rationale for self-trade prevention (#102): the spec
      # crosses Buy+Sell from the SAME end-client (alice) to print a
      # trade and observe the live ref-price displace the fallback.
      # The default-on STP gate would risk-reject the second leg
      # ("would cross own working Buy ..."). Opt alice out, scoped
      # to the conformance run only — the gate stays armed for
      # every other end-client in this stack.
      Trading__Risk__PerEndClient__alice__AllowSelfTrade: "true"
