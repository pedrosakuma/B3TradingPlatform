# Family docker-compose for B3TradingPlatform.
#
# Default `docker compose -f docker/docker-compose.yml up` brings the FULL
# real stack online: matching-platform (FIXP TCP 9876) + marketdata (UMDF
# unicast → WS 8080) + trading-host (Mode=Real, FIRM01 wired) + frontend
# (nginx reverse-proxy on host port 8080). The trading-host actually
# routes /api/orders submissions through matching, prints trades on the book
# in marketdata, and surfaces live ref-prices back to the risk layer —
# no synthetic ER injection, no stub gateway, no "honest no-broker"
# fallback.
#
# Persistence:
#   - trading-data volume → trading-host's WAL + snapshots.
#   - matching-data volume → matching-platform's per-channel snapshots +
#     WAL (upstream pedrosakuma/B3MatchingPlatform#260 phase work). A
#     `docker compose restart matching-platform` no longer drops the
#     order book on the floor, but FIXP session state (SessionVerId,
#     seq numbers, claim registry) is still in-memory only — every
#     client must fully re-Negotiate with a fresh SessionVerId after
#     a restart, and the trading-host stales surviving working orders
#     via ReconcileFirmSessionVerIds (#420). Tracked upstream as
#     pedrosakuma/B3MatchingPlatform#405.
#
# Topology (all on b3-net):
#
#   matching-platform ──FIXP TCP 9876──► trading-host ──REST/WS──► frontend
#         │
#         └──UMDF unicast UDP──► marketdata ──WS 8080──► trading-host
#                                                       (IReferencePrice)
#
# Opt-in overlays:
#
#   - docker-compose.unavailable.yml  → flip trading-host to
#       Mode=Unavailable + suppress matching/marketdata via profiles.
#       Useful for testing the no-broker fail-closed path
#       (POST /api/orders → 502 BadGateway, /health readyForOrders=false).
#   - docker-compose.observability.yml → Prometheus + Grafana sidecars.
#   - docker-compose.market-maker-soak.yml → stack after market-maker +
#       observability for isolated, operator-run strategy evidence (#719).
#   - docker-compose.conformance.yml  → one-shot conformance suite runner
#       (carol admin seed). Combine with real-conformance.yml when running
#       on top of the real stack to opt into RequiresSandboxMatching specs.
#   - docker-compose.real-conformance.yml → see above; sets
#       B3T_REAL_STACK_CONFORMANCE=true and exempts alice from short/STP.
#   - docker-compose.demo.yml         → flip to Mode=Mock + AllowErInjection
#                                        (demo bots + InjectorWorker, #163)
#       (synthetic ER injection inside trading-host; not for production).
#       Implicitly disables matching/marketdata (still come up by default
#       but the in-process Mock+ER-injection path doesn't talk to them).
#   - docker-compose.e2e.yml          → flip to Mode=Stub for the frontend
#       smoke E2E (StubExchangeGateway echoes ERs in-process; matching/
#       marketdata suppressed via profiles).
#
# The PCAP-replay marketdata variant is gated under the `marketdata-pcap`
# profile (separate service from the live unicast `marketdata` because
# the two consume from different transports and configs):
#
#   PCAP_DIR=/path/to/pcaps docker compose --profile marketdata-pcap up
#
# Historical: the previous default was Mode=Unavailable (an "honest
# no-broker" posture), and the real stack was an opt-in overlay
# `docker-compose.real.yml`. That overlay is kept as a no-op shim so
# pre-existing tutorials and CI command-lines that still pass
# `-f docker-compose.real.yml` keep working.

name: b3trading

services:
  matching-platform:
    # NB: pinned to an immutable digest, not :latest. See
    # scripts/matching-image/check-upstream.sh and the
    # matching-image-bump workflow for the bump cadence.
    # Devs can still override (e.g. MATCHING_IMAGE=ghcr.io/pedrosakuma/b3-matching:latest)
    # to test the bleeding edge locally.
    image: ${MATCHING_IMAGE:-ghcr.io/pedrosakuma/b3-matching@sha256:4c6351ac113d0a0c8425bd7ac0686ab0e4333dc44f33ab3878f836817a8fdef5}
    container_name: b3-matching-platform
    restart: unless-stopped
    networks:
      - b3-net
    expose:
      - "9876"   # FIXP TCP listener consumed by trading-host
      - "8080"   # /metrics + /sessions HTTP surface + /api/admin/channels/*
    volumes:
      - ./real/exchange-simulator.bridge.json:/app/config/exchange-simulator.bridge.json:ro
      - ./real/instruments-eqt.json:/app/config/instruments-eqt.json:ro
      - matching-data:/var/lib/b3matching
    command: ["/app/config/exchange-simulator.bridge.json"]
    depends_on:
      # The UnicastUdpPacketSink resolves the "marketdata" hostname at
      # startup via DNS (B3.Exchange.Core.UnicastUdpPacketSink:36). If
      # marketdata is not up, matching aborts with "Name or service
      # not known". service_started is enough — we don't need the WS to
      # be ready before matching opens its UDP sockets.
      marketdata:
        condition: service_started
    healthcheck:
      # Matching ships /metrics + /sessions on its HTTP port (no /health).
      # /metrics returning 200 is a sufficient readiness signal: the HTTP
      # server only binds after the channel dispatcher and the FIXP
      # listener are up (see B3.Exchange.Host.ExchangeHost startup order).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/metrics > /dev/null"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s

  marketdata:
    # Live UMDF unicast variant — reads UDP from matching-platform and
    # fans out over WebSocket to trading-host (and any other consumer).
    # Resolves to the hostname `marketdata` on b3-net (no alias needed)
    # — that name is hard-coded into docker/real/exchange-simulator.bridge.json
    # (matching's UMDF sink) and into trading-host's
    # Trading__MarketData__WsUrl below.
    image: ghcr.io/pedrosakuma/b3-marketdata:${MARKETDATA_TAG:-latest}
    container_name: b3-marketdata
    restart: unless-stopped
    environment:
      UMDF_WS_PORT: "8080"
      UMDF_MULTICAST_CONFIG: /app/config/transport.json
    volumes:
      - ./real/marketdata-transport.json:/app/config/transport.json:ro
    networks:
      - b3-net
    expose:
      - "8080"     # WebSocket fanout consumed by trading-host
      - "30084/udp"  # IncrementalA  (matching → marketdata)
      - "30085/udp"  # IncrementalB  (silent in v1; matching only emits A)
      - "30184/udp"  # SnapshotRecovery
      - "31084/udp"  # InstrumentDefinition
    ports:
      # Host port for direct WS smoke (browser / debug). Not required
      # for the in-bridge trading-host → marketdata WS hop.
      - "${MARKETDATA_PORT:-8081}:8080"
    healthcheck:
      # The image is distroless-ish (no curl/wget). Use dotnet --info as
      # a liveness probe — proves the runtime is alive and the container
      # hasn't crashed silently. The trading-host's WS subscriber retries
      # on its own if the WS server isn't yet accepting.
      test: ["CMD", "/usr/bin/dotnet", "--info"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  trading-host:
    build:
      context: ..
      dockerfile: backend/src/B3.Trading.Host/Dockerfile
    image: ${TRADING_IMAGE:-ghcr.io/pedrosakuma/b3-trading-host:latest}
    container_name: b3-trading-host
    restart: unless-stopped
    depends_on:
      matching-platform:
        condition: service_healthy
      marketdata:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:5000
      # Operator MUST provide a real signing key (>= 32 UTF-8 bytes, not the
      # committed dev default). AuthSigningKeyValidator fails the boot
      # otherwise. Reading from .env keeps the secret out of the YAML.
      Trading__Auth__SigningKey: ${TRADING_AUTH_SIGNING_KEY:?Set TRADING_AUTH_SIGNING_KEY in .env (>= 32 chars, not the dev default)}
      # Auth mode must match the public frontend AUTH_MODE below. Local is the
      # compatibility default; Hybrid/Entra enable /api/auth/exchange and the host
      # options validator fails closed if any ExternalIdentity value below is
      # missing or malformed.
      Trading__Auth__Mode: ${AUTH_MODE:-Local}
      Trading__Auth__LocalLoginEnabled: ${AUTH_LOCAL_LOGIN_ENABLED:-}
      Trading__Auth__SignupEnabled: ${AUTH_SIGNUP_ENABLED:-}
      Trading__Auth__TotpEnabled: ${AUTH_TOTP_ENABLED:-}
      Trading__Auth__WebAuthnEnabled: ${AUTH_WEBAUTHN_ENABLED:-}
      Trading__Auth__WebAuthn__RelyingPartyId: ${AUTH_WEBAUTHN_RP_ID:-localhost}
      Trading__Auth__WebAuthn__Origins__0: ${AUTH_WEBAUTHN_ORIGIN:-http://localhost:8080}
      Trading__Auth__ExternalIdentity__Authority: ${AUTH_AUTHORITY:-}
      Trading__Auth__ExternalIdentity__Issuer: ${AUTH_ISSUER:-}
      Trading__Auth__ExternalIdentity__TenantId: ${AUTH_TENANT_ID:-}
      Trading__Auth__ExternalIdentity__Audience: ${AUTH_API_AUDIENCE:-}
      Trading__Auth__ExternalIdentity__RequiredScope: ${AUTH_REQUIRED_SCOPE:-}
      Trading__Auth__ExternalIdentity__AllowedClientApplicationIds__0: ${AUTH_CLIENT_ID:-}
      # Seed at least one user so the frontend can log in. Override in .env
      # or by mounting a custom appsettings.Production.json.
      Trading__Auth__Users__0__Username: ${TRADING_SEED_USER:-alice}
      Trading__Auth__Users__0__PasswordHash: ${TRADING_SEED_PASSWORD_HASH:?Set TRADING_SEED_PASSWORD_HASH in .env (PBKDF2 base64)}
      Trading__Auth__Users__0__Salt: ${TRADING_SEED_PASSWORD_SALT:?Set TRADING_SEED_PASSWORD_SALT in .env (base64)}
      Trading__Auth__Users__0__Iterations: "600000"
      Trading__Auth__Users__0__Role: user
      # alice routes through FIRM01 in Real mode (every order needs a
      # registered FirmGateway by JWT firm claim). The Mode=Unavailable
      # overlay flips this back to "default".
      Trading__Auth__Users__0__Firm: FIRM01
      # Second user (bob) seeded by default so dogfooding scenarios that
      # need both sides of a trade — crosses, fill-against, position-flip
      # exercises — work out of the box. PBKDF2 is deterministic on
      # plaintext+salt, so reusing TRADING_SEED_PASSWORD_HASH/SALT under
      # a different username produces a valid login for the same password.
      # Slot Users__5 (not 1) so demo-overlay seed users — bot-clientA (1),
      # bot-clientB (2), demo-admin (3), and the conformance overlay's
      # carol (4) — don't collide with bob when overlays stack on top.
      Trading__Auth__Users__5__Username: ${TRADING_SEED_USER_2:-bob}
      Trading__Auth__Users__5__PasswordHash: ${TRADING_SEED_PASSWORD_HASH}
      Trading__Auth__Users__5__Salt: ${TRADING_SEED_PASSWORD_SALT}
      Trading__Auth__Users__5__Iterations: "600000"
      Trading__Auth__Users__5__Role: user
      Trading__Auth__Users__5__Firm: FIRM01
      # Q4.2 (#302). Two extra seed users namespaced under FIRM02 and
      # FIRM03 respectively, so the multi-firm isolation surface is
      # exercised out of the box (alongside FIRM01 above). The same
      # PBKDF2 hash/salt produces a valid login for the same shared
      # password — each user just lives in a different firm namespace.
      # No PositionSeed is wired for these firms intentionally: they
      # start flat so the naked-short gate is exercised honestly.
      Trading__Auth__Users__6__Username: ${TRADING_SEED_USER_FIRM02:-bob-firm02}
      Trading__Auth__Users__6__PasswordHash: ${TRADING_SEED_PASSWORD_HASH}
      Trading__Auth__Users__6__Salt: ${TRADING_SEED_PASSWORD_SALT}
      Trading__Auth__Users__6__Iterations: "600000"
      Trading__Auth__Users__6__Role: user
      Trading__Auth__Users__6__Firm: FIRM02
      Trading__Auth__Users__7__Username: ${TRADING_SEED_USER_FIRM03:-charlie-firm03}
      Trading__Auth__Users__7__PasswordHash: ${TRADING_SEED_PASSWORD_HASH}
      Trading__Auth__Users__7__Salt: ${TRADING_SEED_PASSWORD_SALT}
      Trading__Auth__Users__7__Iterations: "600000"
      Trading__Auth__Users__7__Role: user
      Trading__Auth__Users__7__Firm: FIRM03
      # CORS list from origin of nginx frontend. Same-origin via nginx proxy
      # means this is mostly redundant, but cheap insurance for direct curls.
      Trading__Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-8080}

      # ── Real-mode wire (matching-platform / FIXP) ──────────────────────
      # The Mode=Unavailable overlay clears Mode + Firms__0__* + reverts
      # Auth__Users__{0,5}__Firm to "default".
      Trading__Exchange__Mode: Real
      # CRITICAL: Mode=Real requires UseRealEntryPointClient=true to wire
      # the B3.EntryPoint.Client SDK. Without this flag, appsettings.Docker
      # defaults to MockEntryPointClient which accepts orders locally but
      # never sends them to the matching-platform (#506).
      Trading__Exchange__UseRealEntryPointClient: "true"
      # Single firm wired to matching's pre-#42 default session, matching
      # docker/real/exchange-simulator.bridge.json verbatim so the FIXP
      # Negotiate succeeds. Bridge auth.devMode=true ignores AccessKey,
      # but we still set it so the field is non-empty (validator gate).
      Trading__Exchange__Firms__0__FirmId: FIRM01
      Trading__Exchange__Firms__0__Endpoint: matching-platform:9876
      Trading__Exchange__Firms__0__SessionId: "10101"
      Trading__Exchange__Firms__0__SessionVerId: "1"
      Trading__Exchange__Firms__0__EnteringFirm: "100"
      # Matching's FixpSession parses Credentials as JSON expecting
      # { auth_type, username, access_key }. devMode disables enforcement
      # but the parse still requires the schema. Pre-this-fix, the raw
      # "dev-key-1" string was rejected with "'d' is an invalid start of
      # a value", and a too-thin {"accessKey":...} was rejected with
      # "missing required field (auth_type/username/access_key)".
      Trading__Exchange__Firms__0__AccessKey: '{"auth_type":"basic","username":"10101","access_key":"dev-key-1"}'
      Trading__Exchange__Firms__0__SenderLocation: SP
      Trading__Exchange__Firms__0__EnteringTrader: ALICE
      # Q4.2 (#302). FIRM02 / FIRM03 wired on their own FIXP sessions
      # against matching's extended bridge config (10103 / 10104 with
      # enteringFirm 200 / 300; see docker/real/exchange-simulator.bridge.json).
      # FirmGatewayConnector cold-starts these in parallel; a failed
      # Negotiate falls back to background retry so a partial matching
      # config never blocks host boot. Endpoints + SenderLocation reuse
      # FIRM01's values — they are wire-only metadata.
      Trading__Exchange__Firms__1__FirmId: FIRM02
      Trading__Exchange__Firms__1__Endpoint: matching-platform:9876
      Trading__Exchange__Firms__1__SessionId: "10103"
      Trading__Exchange__Firms__1__SessionVerId: "1"
      Trading__Exchange__Firms__1__EnteringFirm: "200"
      Trading__Exchange__Firms__1__AccessKey: '{"auth_type":"basic","username":"10103","access_key":"dev-key-3"}'
      Trading__Exchange__Firms__1__SenderLocation: SP
      Trading__Exchange__Firms__1__EnteringTrader: BOB02
      Trading__Exchange__Firms__2__FirmId: FIRM03
      Trading__Exchange__Firms__2__Endpoint: matching-platform:9876
      Trading__Exchange__Firms__2__SessionId: "10104"
      Trading__Exchange__Firms__2__SessionVerId: "1"
      Trading__Exchange__Firms__2__EnteringFirm: "300"
      Trading__Exchange__Firms__2__AccessKey: '{"auth_type":"basic","username":"10104","access_key":"dev-key-4"}'
      Trading__Exchange__Firms__2__SenderLocation: SP
      Trading__Exchange__Firms__2__EnteringTrader: CARL3
      # Map the conformance-driven symbols onto the SecurityIds matching
      # advertises in instruments-eqt.json so /api/orders submissions for
      # PETR4/VALE3/ITUB4 hit a real instrument and can print trades.
      Trading__SymbolDirectory__SecurityIds__PETR4: "900000000001"
      Trading__SymbolDirectory__SecurityIds__VALE3: "900000000002"
      Trading__SymbolDirectory__SecurityIds__ITUB4: "900000000003"
      # LotSize and TickSize for the pre-trade MinLotSizeCheck and
      # MinTickSizeCheck gates. Mirrors matching's instruments-eqt.json.
      # Without these, orders with invalid lot/tick pass risk and get
      # rejected by the venue with reject_code=11 (unsupported characteristic).
      Trading__SymbolDirectory__Specs__PETR4__LotSize: "100"
      Trading__SymbolDirectory__Specs__PETR4__TickSize: "0.01"
      Trading__SymbolDirectory__Specs__VALE3__LotSize: "100"
      Trading__SymbolDirectory__Specs__VALE3__TickSize: "0.01"
      Trading__SymbolDirectory__Specs__ITUB4__LotSize: "100"
      Trading__SymbolDirectory__Specs__ITUB4__TickSize: "0.01"
      # Static fallback prices for the price-collar check. Required so the
      # collar accepts cross prices below the live cache warms up. Live
      # ref-prices via the marketdata WS leg below displace these.
      Trading__Risk__ReferencePrices__PETR4: "32.50"
      Trading__Risk__ReferencePrices__VALE3: "65.00"
      Trading__Risk__ReferencePrices__ITUB4: "30.00"
      # CVM report hashing salt. Required by boot guard. Use a proper secret
      # in production; this placeholder is acceptable for local dev/test.
      Trading__Reports__Cvm__OwnerHashSalt: ${TRADING_CVM_OWNER_HASH_SALT:-local-dev-cvm-salt-not-for-prod}
      # ClOrdId masking salt for drop-copy compliance (#435). Required by boot guard.
      Trading__DropCopy__ClOrdIdMaskSalt: ${TRADING_CLORDID_MASK_SALT:-local-dev-clordid-mask-salt-not-for-prod}
      # #642. AEAD key for frozen outbound commands and HMAC key for REST
      # idempotency scope references. The local default is intentionally
      # non-secret; production/public overlays must supply a real 256-bit key.
      Trading__OutboundCommandProtection__ActiveKeyId: ${TRADING_OUTBOUND_KEY_ID:-local-dev}
      Trading__OutboundCommandProtection__ActiveKeyVersion: "1"
      Trading__OutboundCommandProtection__StableReferenceKeyId: ${TRADING_OUTBOUND_KEY_ID:-local-dev}
      Trading__OutboundCommandProtection__StableReferenceKeyVersion: "1"
      Trading__OutboundCommandProtection__Keys__0__KeyId: ${TRADING_OUTBOUND_KEY_ID:-local-dev}
      Trading__OutboundCommandProtection__Keys__0__Version: "1"
      Trading__OutboundCommandProtection__Keys__0__KeyBase64: ${TRADING_OUTBOUND_KEY_BASE64:-N2tjXhiFZ61TrXVa78oABf6mKVhmZV9xV4IxWA4QB9Y=}
      # #416. Margin enforcement now defaults to ON. Fund the default
      # dogfood/recovery users that participate in real crossed-order
      # flows so Buy submissions do not get risk-rejected on a cold stack.
      Trading__Cash__Seeds__0__EndClientId: ${TRADING_SEED_USER_2:-bob}
      Trading__Cash__Seeds__0__FirmId: FIRM01
      Trading__Cash__Seeds__0__InitialAvailable: "100000.00"
      Trading__Cash__Seeds__1__EndClientId: ${TRADING_SEED_USER_FIRM02:-bob-firm02}
      Trading__Cash__Seeds__1__FirmId: FIRM02
      Trading__Cash__Seeds__1__InitialAvailable: "100000.00"
      # Opening positions seeded for the default dogfood accounts so
      # both alice and bob can sell out of the box without being blocked
      # by the NoNakedShortCheck gate. Quantities are expressed in
      # board-lot units (matching's lotSize=100, so 2000 = 20 lots).
      # Seeds apply only when PersistenceRecovery leaves the slot empty,
      # so a warm restart never overwrites real fills.
      Trading__Positions__Seeds__0__EndClientId: ${TRADING_SEED_USER:-alice}
      Trading__Positions__Seeds__0__Symbol: PETR4
      Trading__Positions__Seeds__0__Quantity: "2000"
      Trading__Positions__Seeds__0__AverageEntryPrice: "32.50"
      # PR #316 P2: explicit firm namespace. Without this the seed lands
      # in PositionKeeper.DefaultFirmId and is invisible to FIRM01 users
      # (the naked-short gate then rejects the first Sell). The
      # Mode=Unavailable overlay reverts the user firm to "default"; its
      # own seed-firm override matches.
      Trading__Positions__Seeds__0__Firm: FIRM01
      Trading__Positions__Seeds__1__EndClientId: ${TRADING_SEED_USER:-alice}
      Trading__Positions__Seeds__1__Symbol: VALE3
      Trading__Positions__Seeds__1__Quantity: "2000"
      Trading__Positions__Seeds__1__AverageEntryPrice: "65.00"
      Trading__Positions__Seeds__1__Firm: FIRM01
      Trading__Positions__Seeds__2__EndClientId: ${TRADING_SEED_USER_2:-bob}
      Trading__Positions__Seeds__2__Symbol: PETR4
      Trading__Positions__Seeds__2__Quantity: "2000"
      Trading__Positions__Seeds__2__AverageEntryPrice: "32.50"
      Trading__Positions__Seeds__2__Firm: FIRM01
      Trading__Positions__Seeds__3__EndClientId: ${TRADING_SEED_USER_2:-bob}
      Trading__Positions__Seeds__3__Symbol: VALE3
      Trading__Positions__Seeds__3__Quantity: "2000"
      Trading__Positions__Seeds__3__AverageEntryPrice: "65.00"
      Trading__Positions__Seeds__3__Firm: FIRM01
      # Live reference price via the marketdata WS leg (RFC §4.5 D3).
      # MarketDataReferencePrice subscribes to PETR4/VALE3/ITUB4 on boot;
      # cache misses fall back to Trading:Risk:ReferencePrices map. The
      # subscription is best-effort: marketdata being slow to come up
      # doesn't block trading-host startup. The Mode=Unavailable overlay
      # clears WsUrl so the subscriber stays idle.
      Trading__MarketData__WsUrl: ws://marketdata:8080/ws
      Trading__MarketData__Symbols__0: PETR4
      Trading__MarketData__Symbols__1: VALE3
      Trading__MarketData__Symbols__2: ITUB4
    volumes:
      - trading-data:/var/lib/b3trading
    networks:
      - b3-net
    expose:
      - "5000"
    ports:
      # Exposed on host for direct curls / tooling. Comment out in
      # locked-down environments where only the frontend should be public.
      - "${TRADING_HOST_PORT:-5000}:5000"

  frontend:
    build:
      context: ../frontend
    image: ${FRONTEND_IMAGE:-ghcr.io/pedrosakuma/b3-trading-frontend:latest}
    container_name: b3-trading-frontend
    restart: unless-stopped
    depends_on:
      trading-host:
        condition: service_healthy
    environment:
      # Deploy-time defaults rendered into frontend/js/env.js at container
      # boot. Empty MARKETDATA_WS_URL preserves the localhost/off-localhost
      # fallback chain in js/protocol.js; APP_TITLE controls the browser title
      # plus login/app-shell brand text. See #572 / #596.
      MARKETDATA_WS_URL: ${MARKETDATA_WS_URL:-}
      APP_TITLE: ${APP_TITLE:-B3TradingPlatform}
      # Public browser auth config. Local remains the compatibility default.
      # Hybrid/Entra use MSAL Authorization Code + PKCE and must never include
      # a client secret in this image or compose environment.
      AUTH_MODE: ${AUTH_MODE:-Local}
      AUTH_LOCAL_LOGIN_ENABLED: ${AUTH_LOCAL_LOGIN_ENABLED:-}
      AUTH_SIGNUP_ENABLED: ${AUTH_SIGNUP_ENABLED:-}
      AUTH_TOTP_ENABLED: ${AUTH_TOTP_ENABLED:-}
      AUTH_AUTHORITY: ${AUTH_AUTHORITY:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_API_SCOPE: ${AUTH_API_SCOPE:-}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-}
      AUTH_LOGOUT_URI: ${AUTH_LOGOUT_URI:-}
      AUTH_KNOWN_AUTHORITIES: ${AUTH_KNOWN_AUTHORITIES:-}
    networks:
      - b3-net
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # PCAP-replay marketdata variant. Opt-in via `--profile marketdata-pcap`.
  # Replays a captured B3 UMDF session for offline regression. Conflicts
  # with the live `marketdata` service above on the same hostname/ports —
  # do not enable both at once.
  #
  #   PCAP_DIR=/path/to/pcaps docker compose --profile marketdata-pcap up
  marketdata-pcap:
    image: ghcr.io/pedrosakuma/b3-marketdata:${MARKETDATA_TAG:-latest}
    container_name: b3-marketdata-pcap
    restart: unless-stopped
    profiles: ["marketdata-pcap"]
    environment:
      WS_PORT: "8080"
      PCAP_DIR: /app/pcap
      PCAP_PREFIX: ${PCAP_PREFIX:-20250331_MBO_084_EQT}
      REPLAY_SPEED: ${REPLAY_SPEED:-2}
    volumes:
      - ${PCAP_DIR:-./pcap}:/app/pcap:ro
    networks:
      - b3-net
    ports:
      - "${MARKETDATA_PCAP_PORT:-8082}:8080"
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"

volumes:
  trading-data:
    name: b3-trading-data
  # Persists matching-platform's per-channel snapshots + WAL across
  # restarts (upstream pedrosakuma/B3MatchingPlatform#260). Closes the
  # venue half of the desync described in #132 — see #133.
  matching-data:
    name: b3-matching-data

networks:
  b3-net:
    name: b3-net
    driver: bridge
