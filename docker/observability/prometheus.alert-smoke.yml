global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/v1/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
        labels:
          source: otel-collector

  - job_name: otel-collector-self
    static_configs:
      - targets:
          - otel-collector:8888
        labels:
          source: otel-collector-self

  - job_name: synthetic-alert-smoke
    static_configs:
      - targets:
          - synthetic-alert-source:8080
