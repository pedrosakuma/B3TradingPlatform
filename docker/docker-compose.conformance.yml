# Conformance overlay for the family stack. Adds a one-shot
# `conformance` service that runs the B3.Trading.Conformance suite
# against the running trading-host on the same network.
#
# Usage:
#   docker compose \
#       -f docker/docker-compose.yml \
#       -f docker/docker-compose.conformance.yml \
#       up -d --wait trading-host
#   docker compose \
#       -f docker/docker-compose.yml \
#       -f docker/docker-compose.conformance.yml \
#       run --rm conformance
#
# Profile-gated so it does NOT auto-start with `docker compose up`. It's
# always invoked explicitly via `run --rm`.

services:
  # Add an admin-role seed user so the conformance suite can hit /admin/*.
  # Reuses alice's hash/salt (PBKDF2 is deterministic on plaintext+salt)
  # under a different username + role=admin, so no extra secret-management
  # is required. Slot Users__4 to avoid colliding with base (alice=0,
  # bob=3) and demo (bot-clientA=1, bot-clientB=2).
  trading-host:
    environment:
      Trading__Auth__Users__4__Username: ${TRADING_ADMIN_USER:-carol}
      Trading__Auth__Users__4__PasswordHash: ${TRADING_SEED_PASSWORD_HASH:?Set TRADING_SEED_PASSWORD_HASH in .env (PBKDF2 base64)}
      Trading__Auth__Users__4__Salt: ${TRADING_SEED_PASSWORD_SALT:?Set TRADING_SEED_PASSWORD_SALT in .env (base64)}
      Trading__Auth__Users__4__Iterations: "600000"
      Trading__Auth__Users__4__Role: admin
      Trading__Auth__Users__4__Firm: default
      # #416. Margin enforcement now defaults to ON. The conformance smoke
      # user (alice by default) submits real Buy orders in multiple specs,
      # so fund the account up front the same way an operator would.
      Trading__Cash__Seeds__2__EndClientId: ${TRADING_SEED_USER:-alice}
      Trading__Cash__Seeds__2__FirmId: FIRM01
      Trading__Cash__Seeds__2__InitialAvailable: "100000.00"
      # Q4.4 (#304). The conformance suite authenticates from a single
      # container IP and issues many logins in rapid succession across
      # specs. With the default per-IP auth bucket (burst=3, 1/s refill)
      # that legitimate volume trips the limiter and fails specs that
      # are not exercising rate-limit behaviour. The suite does not
      # itself cover rate-limit semantics, so disable the limiter for
      # the conformance overlay only — production hosts keep it on.
      Trading__RateLimit__Enabled: "false"
      # Q4.8 (#308) pass-2. CVM 35/505 export requires a non-empty
      # LGPD opacification salt at boot. The conformance suite does
      # not exercise CVM endpoints, but the boot guard fires on
      # startup; bind a fixed placeholder so the host can come up.
      # Production hosts MUST configure a real secret.
      Trading__Reports__Cvm__OwnerHashSalt: "conformance-only-cvm-salt-placeholder-DO-NOT-USE-IN-PROD"
      # #435 Part B. Drop-copy ClOrdId masker salt — boot-guard throws
      # if unset in non-Development. Placeholder for conformance only.
      Trading__DropCopy__ClOrdIdMaskSalt: "conformance-only-clordid-mask-salt-placeholder-DO-NOT-USE-IN-PROD"

  conformance:
    build:
      context: ..
      dockerfile: docker/conformance/Dockerfile
    image: ${CONFORMANCE_IMAGE:-b3-trading-conformance:dev}
    profiles: ["conformance"]
    depends_on:
      # Image health is process-only (/live). The entrypoint performs the
      # explicit /ready wait for order-capable modes and skips it only for
      # Unavailable contract runs.
      trading-host:
        condition: service_healthy
    environment:
      # Internal DNS via the b3-net bridge — same network as trading-host.
      B3T_BASE_URL: http://trading-host:5000
      B3T_AUTH_USER: ${TRADING_SEED_USER:-alice}
      # Plaintext password that produced TRADING_SEED_PASSWORD_HASH +
      # _SALT. Default `wonderland` matches the seeds committed in
      # .env.example. Override in .env when rotating.
      B3T_AUTH_PASS: ${TRADING_SEED_PASSWORD:-wonderland}
      # Admin user for /admin/* coverage. Reuses the same PBKDF2 hash/salt
      # because PBKDF2 is deterministic for a given plaintext+salt — same
      # password material, different username + admin role.
      B3T_ADMIN_USER: ${TRADING_ADMIN_USER:-carol}
      B3T_ADMIN_PASS: ${TRADING_SEED_PASSWORD:-wonderland}
      # Mirror the host's HS256 signing key into the conformance container
      # so scenarios that need to mint deterministic tokens (e.g. expired-
      # JWT rejection, see Spec_HTTP_Auth/ExpiredTokenTests) can sign with
      # the same key the host validates against. Without this, those
      # scenarios skip cleanly — they're optional, not gated.
      B3T_AUTH_SIGNING_KEY: ${TRADING_AUTH_SIGNING_KEY:-}
    networks:
      - b3-net
