# Overlay used by the opt-in frontend smoke E2E (workflow_dispatch).
#
# Default `docker-compose.yml` brings the trading-host up in
# Mode=Unavailable (fail-closed: POST /orders → 502). For a UI smoke
# test we need an in-process gateway that produces ExecutionReports
# without touching B3 — that is StubExchangeGateway. The overlay only
# flips the mode and adds a single seeded firm so /admin/firms shows
# something real.

services:
  trading-host:
    environment:
      Trading__Exchange__Mode: Stub
      # StubExchangeGateway echoes ERs immediately for the seeded firm.
      Trading__Exchange__Firms__0__FirmId: default
      Trading__Exchange__Firms__0__Endpoint: stub://e2e
      # Smoke E2E posts orders by symbol; SymbolDirectory turns the
      # symbol into a SecurityId so the validator does not 400.
      Trading__SymbolDirectory__SecurityIds__PETR4: "4321"
      Trading__SymbolDirectory__SecurityIds__VALE3: "1234"
      # #382. The smoke E2E uses the in-process StubExchangeGateway and
      # the matching/marketdata services are suppressed via profiles;
      # the SDK has nothing to subscribe to. Clear the inherited WsUrl
      # and pin EnableBook off so the trading-host stays quiet on the
      # MD side (no reconnect churn, no SDK Book subscription).
      Trading__MarketData__WsUrl: ""
      Trading__MarketData__EnableBook: "false"
