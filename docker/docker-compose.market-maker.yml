# Market-maker bot overlay (#683, evolved from the simulator-bot in
# #134). Stacks on top of the default real stack to add a single
# external FIXP client that behaves as a co-located two-sided market
# maker: it submits one resting bid + one resting ask per configured
# instrument and re-quotes immediately on fill/cancel/reject — so
# sandbox/demo instruments always have a market to trade against. The
# trading-host stays Real; the bot provides liquidity from the outside.
#
# Usage:
#   docker compose \
#       -f docker/docker-compose.yml \
#       -f docker/docker-compose.market-maker.yml \
#       up -d
#
# This is the canonical real-market sandbox recipe (#683 item 3): it
# ALSO flips trading-host's Trading__Sandbox__AllowSelfCashDeposit to
# true, so any logged-in end-client can self-service `POST
# /api/balance/deposit` for buying power and then actually trade against
# the bot's resting quotes. See docs/DOCKER.md "Market-maker overlay"
# for the full walkthrough and the safety notes below.
#
# Do NOT additionally stack docker-compose.demo.yml on top of this
# overlay: demo.yml flips trading-host to Mode=Mock, which serves
# end-client orders from an in-process MockEntryPointClient instead of
# routing them to matching-platform — so end-client orders would never
# actually reach the order book the bot is quoting into, defeating the
# whole point of this overlay. demo.yml's ER-injection story and this
# overlay's real-market story are mutually exclusive.
#
# The bot connects on FIXP session 10102 (NOT 10101 — that one belongs to
# trading-host's FIRM01 wiring). Both sessions are pre-declared in
# docker/real/exchange-simulator.bridge.json so matching-platform accepts
# the bot's Negotiate without operator intervention.
#
# It also connects to B3MarketDataPlatform's WebSocket feed (same
# `marketdata:8080/ws` endpoint trading-host uses, see
# Trading__MarketData__WsUrl in docker-compose.yml) to anchor its quotes
# on the live TradingReferencePrice/LastTradePrice instead of a static
# config value (#683, item "mm-marketdata-conn"). Feed-loss behavior is
# explicit: this sandbox overlay retains the legacy StaticRefPrice fallback;
# operators can select PauseAndCancel to require a fresh per-symbol mark.
# Reproducible baseline/feature/outage evidence stacks the dedicated
# docker-compose.market-maker-soak.yml overlay; see
# docs/operations/market-maker-soak.md.

name: b3trading

services:
  trading-host:
    environment:
      # Self-service cash deposit (#679/#681): lets any authenticated
      # end-client top up their own CashLedger balance via `POST
      # /api/balance/deposit` instead of requiring an admin round-trip —
      # the actual motivator for this whole overlay, since a market
      # maker resting quotes is only useful if end-clients have buying
      # power to trade against them. Disabled by default in the base
      # stack; this overlay is the one place it's turned on.
      #
      # SAFETY: the host refuses to boot with this true in
      # ASPNETCORE_ENVIRONMENT=Production unless
      # Trading__Sandbox__AllowSelfCashDepositInProduction=true is ALSO
      # set (SandboxCashDepositBootGuard) — do not flip that opt-out
      # for a real deployment; this overlay is sandbox/demo-only.
      Trading__Sandbox__AllowSelfCashDeposit: "true"

  market-maker-bot:
    build:
      context: ..
      dockerfile: backend/tools/B3.Trading.MarketMakerBot/Dockerfile
    image: ${MARKET_MAKER_BOT_IMAGE:-ghcr.io/pedrosakuma/b3-market-maker-bot:latest}
    container_name: b3-market-maker-bot
    restart: unless-stopped
    networks:
      - b3-net
    depends_on:
      matching-platform:
        condition: service_healthy
      marketdata:
        condition: service_started
    environment:
      # ── FIXP session ───────────────────────────────────────────────
      MarketMaker__Endpoint: matching-platform:9876
      MarketMaker__SessionId: "10102"
      MarketMaker__SessionVerId: "1"
      MarketMaker__EnteringFirm: "100"  # FIRM01 enteringFirmCode
      # Matching's FixpSession parses Credentials as JSON expecting
      # {auth_type, username, access_key} — see docker/docker-compose.yml
      # for the same shape on trading-host's session 10101.
      MarketMaker__AccessKey: '{"auth_type":"basic","username":"10102","access_key":"dev-key-2"}'
      MarketMaker__SenderLocation: SP
      MarketMaker__EnteringTrader: MM

      # ── Market data + feed-loss policy ─────────────────────────────
      # Same feed trading-host subscribes to (see Trading__MarketData__WsUrl
      # in docker-compose.yml). Optional: if unset, or the feed can't
      # connect, StaticRefPrice quotes off each instrument's configured
      # RefPrice. PauseAndCancel instead suppresses/cancels that symbol
      # until a fresh current-connection reference is available.
      MarketMaker__MarketData__WsUrl: ws://marketdata:8080/ws
      MarketMaker__MarketData__FeedLossPolicy: StaticRefPrice
      MarketMaker__MarketData__MaxReferenceAge: "00:00:30"

      # ── Behaviour ──────────────────────────────────────────────────
      MarketMaker__StateDirectory: /var/lib/b3-market-maker-bot
      # Defensive safety net only — the primary re-quote path is
      # event-driven (fills/cancels/rejects), see MarketMakerWorker.
      MarketMaker__ReconcileInterval: "00:00:05"
      # A successfully transmitted cancel whose ER is lost is retried only
      # after this bounded acknowledgement window; MinRequoteInterval remains
      # the secondary anti-churn guard.
      MarketMaker__CancelAckTimeout: "00:00:10"
      # Opt in only when matching-platform contains B3MatchingPlatform#569:
      # older matching versions emit ACCEPTED before mass-cancel execution.
      MarketMaker__StartupCleanupEnabled: "false"
      # Terminal cleanup may drain the venue's full 100k-order cap before
      # reporting completion. Keep this separate from normal cancel recovery.
      MarketMaker__StartupCleanupTimeout: "00:05:00"
      # Gross/pre-fee process-local P&L snapshots. Unrealized P&L is
      # omitted unless the connected live mark is newer than MarkMaxAge.
      MarketMaker__Telemetry__SnapshotInterval: "00:00:30"
      MarketMaker__Telemetry__MarkMaxAge: "00:00:30"
      # OTLP remains disabled here by default. Set the standard
      # OTEL_EXPORTER_OTLP_ENDPOINT/PROTOCOL variables when routing this
      # bot to a collector (b3deploy owns collector -> Azure Monitor).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}

      # ── Instruments (must match docker/real/instruments-eqt.json) ──
      MarketMaker__Instruments__0__Symbol: PETR4
      MarketMaker__Instruments__0__SecurityId: "900000000001"
      MarketMaker__Instruments__0__RefPrice: "30.00"
      MarketMaker__Instruments__0__TickSize: "0.01"
      MarketMaker__Instruments__0__LotSize: "100"
      MarketMaker__Instruments__0__QuoteLots: "1"
      MarketMaker__Instruments__0__SpreadTicks: "5"
      # Inventory skew is opt-in per instrument. FullSkewAtLots is the
      # normalization/saturation band only; it does not cap inventory.
      MarketMaker__Instruments__0__InventorySkew__Enabled: "false"
      MarketMaker__Instruments__0__InventorySkew__FullSkewAtLots: "10"
      MarketMaker__Instruments__0__InventorySkew__MaxSkewTicks: "5"
      # Trade-driven adaptive widening is independently opt-in per
      # instrument. Static SpreadTicks always remains the floor.
      MarketMaker__Instruments__0__VolatilitySpread__Enabled: "false"
      MarketMaker__Instruments__0__VolatilitySpread__Window: "00:01:00"
      MarketMaker__Instruments__0__VolatilitySpread__MaxSamples: "120"
      MarketMaker__Instruments__0__VolatilitySpread__MinSamples: "10"
      MarketMaker__Instruments__0__VolatilitySpread__Multiplier: "1.0"
      MarketMaker__Instruments__0__VolatilitySpread__MaxAdditionalSpreadTicks: "20"

      MarketMaker__Instruments__1__Symbol: VALE3
      MarketMaker__Instruments__1__SecurityId: "900000000002"
      MarketMaker__Instruments__1__RefPrice: "70.00"
      MarketMaker__Instruments__1__TickSize: "0.01"
      MarketMaker__Instruments__1__LotSize: "100"
      MarketMaker__Instruments__1__QuoteLots: "1"
      MarketMaker__Instruments__1__SpreadTicks: "5"
      MarketMaker__Instruments__1__InventorySkew__Enabled: "false"
      MarketMaker__Instruments__1__InventorySkew__FullSkewAtLots: "10"
      MarketMaker__Instruments__1__InventorySkew__MaxSkewTicks: "5"
      MarketMaker__Instruments__1__VolatilitySpread__Enabled: "false"
      MarketMaker__Instruments__1__VolatilitySpread__Window: "00:01:00"
      MarketMaker__Instruments__1__VolatilitySpread__MaxSamples: "120"
      MarketMaker__Instruments__1__VolatilitySpread__MinSamples: "10"
      MarketMaker__Instruments__1__VolatilitySpread__Multiplier: "1.0"
      MarketMaker__Instruments__1__VolatilitySpread__MaxAdditionalSpreadTicks: "20"

      MarketMaker__Instruments__2__Symbol: ITUB4
      MarketMaker__Instruments__2__SecurityId: "900000000003"
      MarketMaker__Instruments__2__RefPrice: "32.00"
      MarketMaker__Instruments__2__TickSize: "0.01"
      MarketMaker__Instruments__2__LotSize: "100"
      MarketMaker__Instruments__2__QuoteLots: "1"
      MarketMaker__Instruments__2__SpreadTicks: "5"
      MarketMaker__Instruments__2__InventorySkew__Enabled: "false"
      MarketMaker__Instruments__2__InventorySkew__FullSkewAtLots: "10"
      MarketMaker__Instruments__2__InventorySkew__MaxSkewTicks: "5"
      MarketMaker__Instruments__2__VolatilitySpread__Enabled: "false"
      MarketMaker__Instruments__2__VolatilitySpread__Window: "00:01:00"
      MarketMaker__Instruments__2__VolatilitySpread__MaxSamples: "120"
      MarketMaker__Instruments__2__VolatilitySpread__MinSamples: "10"
      MarketMaker__Instruments__2__VolatilitySpread__Multiplier: "1.0"
      MarketMaker__Instruments__2__VolatilitySpread__MaxAdditionalSpreadTicks: "20"
    volumes:
      - market-maker-bot-state:/var/lib/b3-market-maker-bot

volumes:
  market-maker-bot-state:
    driver: local
